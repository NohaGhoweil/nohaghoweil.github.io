  { slug:'issue-tracker', title:'IT help without the phone call',
    sections:[
      { id:'overview', nav:'Overview', title:'IT help without the phone call',
        lede:'An Arabic app for Aswan Governorate employees to report IT and network problems, then follow them until they’re fixed.',
        text:['The app also covers suggestions, rewards, thank-you cards, skill development and future jobs. This case study focuses on reporting network and IT issues, plus the main pages.'],
        blocks:[
          { type:'facts', items:[['Role','UI/UX designer'],['Year','July 2023'],['Timeline','2 weeks'],['Platform','Mobile · Arabic, right to left']] },
          { type:'image', label:'Employees Issue Tracker', src:`${IT}cover-mockup.webp`, alt:'Three green Arabic screens: the employee home, “What’s your problem?” with report status, and the list of reports' }
        ],
        note:'Made at the Aswan Digital Transformation Center, for the governorate’s own staff. The original case study is on my Behance.' },

      { id:'problem', nav:'The problem', label:'The problem', title:'Every level of tech skill, one app',
        text:['Two challenges shaped the design. Government employees have very different levels of tech skill, and IT staff need to reach the exact place a problem happens.',
              'Three people had to be served by the same app:'],
        blocks:[
          { type:'caps', items:[
            ['Employee','“I want to report IT issues through a mobile app, so I can follow the status of my reports.”'],
            ['IT employee','“I want to track all IT issues, so I can prioritise and solve them.”'],
            ['IT manager','“I want a clear way to evaluate IT staff by how they resolve issues.”']] }
        ],
        note:'The goal: make reporting and solving IT issues simple for every employee, whatever their tech skills.' },

      { id:'research', nav:'Research', label:'Research', title:'Listening to people using the old app',
        text:['I ran unmoderated remote usability tests of the existing issue tracker app, and interviewed employees aged 22 to 45, chosen from the people who ask IT for help most.'],
        blocks:[
          { type:'quotes', label:'What employees said', items:[
            ['I have to get a smartphone to have the app.'],
            ['What if I don’t have internet on my phone?'],
            ['I want to know how I can report an issue.', '', true],
            ['I want to see the quality of the IT staff’s solutions.']] },
          { type:'caps', items:[
            ['Ahmed, 28, IT staff','The persona that best represents my interviews and the affinity diagram.'],
            ['Needs','A simple way to manage IT issues and see where each one is, so he can solve them smoothly.'],
            ['Frustrations','Spam reports and missing details from other employees, and no way to check who’s free to solve a problem.']] }
        ],
        note:'Ahmed is a persona, built from my interview notes.' },

      { id:'define', nav:'Pain points', label:'Pain points', title:'Four groups of pain points',
        text:['I sorted the interview notes into an affinity diagram. Four themes came out of it.'],
        blocks:[
          { type:'image', label:'Affinity diagram', src:`${IT}affinity.webp`, alt:'Sticky notes in four groups: unattractive look, confusing flow, impractical to use, forced to use' },
          { type:'caps', items:[
            ['Unattractive look','A crowded home screen, too many colours, and steps that didn’t match.'],
            ['Confusing flow','Too many steps, and help articles mixed up with self-development courses.'],
            ['Impractical to use','Icons with no labels, and reports sent through a separate gateway.'],
            ['Forced to use','Employees had to type in their employee ID.']] },
          { type:'learn', heading:'How might we…', items:[
            'make the interface more visually appealing?',
            'make the flow shorter and clearer?',
            'design the system to prevent user errors?'] }
        ],
        note:'Each “How might we” became a rule for the redesign.' },

      { id:'process', nav:'Process', label:'Process', title:'From paper to prototype', wide:true,
        text:['With two weeks, I kept the process simple: empathise, define, ideate, prototype, test. I sketched the key screens on paper, mapped how a report branches, then built a high-fidelity prototype in Figma.'],
        blocks:[
          { type:'image', label:'Paper sketches', src:`${IT}sketches.webp`, alt:'Hand-drawn Arabic phone sketches: chat, network reports with status counts, and the list of reports' },
          { type:'image', label:'How a report branches', src:`${IT}map.webp`, alt:'Map: an issue report splits into a technical issue, useful topics and internet speed, or a specific device: printer, PC or scanner' },
          { type:'image', label:'Flow · home to my reports', src:`${IT}flow-home.webp`, alt:'Three screens linked by arrows: home, network reports, then the list of previous reports' },
          { type:'image', label:'Flow · reporting an internet problem', src:`${IT}flow-report.webp`, alt:'Three screens linked by arrows: choose internet problem, pick the faulty device, then describe it and send' }
        ] },

      { id:'design', nav:'Final design', label:'Final design', title:'The final screens', wide:true,
        text:['A calm green interface that leans on icons and pictures, so employees with any level of tech skill can find their way.'],
        blocks:[
          { type:'spotlight', label:'The key screen', title:'Report a problem in a few taps', src:`${IT}s-report.webp`, alt:'Network reports: “What’s your problem?”, a report button, reports by status, and three shortcuts',
            items:['One big “Report a problem” button at the top.',
                   'My reports at a glance: not started, in progress and solved.',
                   'Speed test, the governorate’s apps and help articles one tap away.'] },
          { type:'screens', title:'Reporting a problem', items:[
            { src:`${IT}s-category.webp`, title:'Choose the type', text:'Internet, a specific device, or Windows, with a search on top.' },
            { src:`${IT}s-device.webp`, title:'Pick the device', text:'Printer, computer, screen or scanner, as large icons.' },
            { src:`${IT}s-describe.webp`, title:'Describe it', text:'Common faults as options, a note, and a photo of the problem.' },
            { src:`${IT}s-sent.webp`, title:'Sent, with a number', text:'A report number to follow it up.' }] },
          { type:'screens', grid:true, title:'Following it up', items:[
            { src:`${IT}s-reports.webp`, title:'My reports', text:'Filtered by status: solved, in progress or not started.' },
            { src:`${IT}s-chats.webp`, title:'Chats', text:'A conversation with IT for each report.' },
            { src:`${IT}s-notifs.webp`, title:'Notifications', text:'Updates on each report as it moves along.' },
            { src:`${IT}s-speed.webp`, title:'Speed test', text:'Check the connection before reporting it.' }] },
          { type:'screens', grid:true, title:'The main pages', items:[
            { src:`${IT}s-splash.webp`, title:'Splash' },
            { src:`${IT}s-signup.webp`, title:'Sign up' },
            { src:`${IT}s-home.webp`, title:'Home', text:'Every service as a large icon.' },
            { src:`${IT}s-menu.webp`, title:'Menu' },
            { src:`${IT}s-skills.webp`, title:'Develop your skills' },
            { src:`${IT}s-courses.webp`, title:'Course videos' },
            { src:`${IT}s-plan.webp`, title:'Personal plan' },
            { src:`${IT}s-jobs.webp`, title:'Future jobs' }] }
        ] },

      { id:'learn', nav:'What I learned', label:'Looking back', title:'What I learned',
        blocks:[
          { type:'learn', items:[
            'Testing the existing app first gave me a clear list of what to fix, even in two weeks.',
            'For people with very different tech skills, icons need labels. Neither works as well alone.',
            'A report split into small choices (type, device, fault) is easier than one long form.'] },
          { type:'learn', heading:'What I’d do next', items:[
            'Test the new flow with the same employees.',
            'Measure how long a report takes, before and after.'] }
        ] }
    ] },

  { slug:'prime', title:'From paper forms to one platform',
    sections:[
      { id:'overview', nav:'Overview', title:'From paper forms to one platform',
        lede:'Prime is a web and mobile platform for the Aswan water and sanitation company: accounts, warehouses, permissions and employee affairs in one place.',
        blocks:[
          { type:'facts', items:[['Role','UX researcher · UI/UX designer'],['Timeline','6 weeks'],['Platform','Web + mobile · Arabic'],['Tools','Adobe XD, Figma, Illustrator']] },
          { type:'image', label:'Prime mobile app', src:`${PR}cover-mockup.webp`, alt:'Three Prime screens in Arabic: searching items, the warehouse dashboard with four counts and a chart, and the About page' }
        ],
        note:'Made at the Aswan Digital Transformation Center. The original case study is on my Behance.' },

      { id:'problem', nav:'The problem', label:'The problem', title:'Paper, spreadsheets and too many systems',
        text:['The company ran accounts, inventory and employee affairs on paper and in separate tools. Before designing anything, I visited the company to see how the work really happened.'],
        blocks:[
          { type:'caps', items:[
            ['Efficiency','Staff switched between systems and did a lot by hand. They needed one place for everything.'],
            ['Workflow','Manual inventory and staff records led to errors and delays.'],
            ['Control','People felt lost in complex systems, and wanted screens that fit their role.']] },
          { type:'quotes', label:'What staff said', items:[
            ['I spend too much time switching between different systems.'],
            ['I feel like I’m drowning in paperwork.'],
            ['I wish there was an easier way to manage inventory.', '', true],
            ['I need more visibility into employee schedules.']] }
        ],
        note:'These lines come from my empathy map of the people I met.' },

      { id:'users', nav:'Who it’s for', label:'Who it’s for', title:'Two people, two very different days',
        text:['Managers, office staff and field staff all use Prime. Two personas kept the design grounded:'],
        blocks:[
          { type:'caps', items:[
            ['Ahmed, 32, field technician','Recently joined. Hard to get the right information on site, which delays repairs.'],
            ['His goal','Fix problems fast, with the right equipment and tools.'],
            ['Hala, 40, customer relations manager','15 years at the company. Complaints reach her through too many channels.'],
            ['Her goal','Solve issues quickly and keep communication in one place.']] },
          { type:'image', label:'Empathy map', src:`${PR}empathy.webp`, alt:'Empathy map: what staff say, think, do and feel about paperwork, manual data entry and switching systems' }
        ],
        note:'Personas built from my research at the company.' },

      { id:'process', nav:'Process', label:'Process', title:'Structure first, then sketches', wide:true,
        text:['I mapped the platform’s structure first: human resources, entitlements, warehouses, accounting, central administration, and attendance and leave. Then I sketched the web and mobile screens in Arabic.'],
        blocks:[
          { type:'image', label:'Information architecture', src:`${PR}ia.webp`, alt:'Site map: menu, about, home, profile and contact, with home branching into the company’s departments' },
          { type:'image', label:'Paper sketches', src:`${PR}sketches.webp`, alt:'Pencil sketches of the web login, tables and forms, and the mobile login, menu and warehouse screens' }
        ] },

      { id:'design', nav:'Final design', label:'Final design', title:'The main screens', wide:true,
        text:['A calm blue interface: tables for long days at the office, and a lighter mobile app for checking warehouses on the go.'],
        blocks:[
          { type:'gallery', cols:3, items:[
            { label:'Login', src:`${PR}w-login.webp`, alt:'Web login with the company logo', caption:'Each employee signs in to a home page for their role.' },
            { label:'Add permissions', src:`${PR}w-permissions.webp`, alt:'Permissions table with search, filters and an add button', caption:'Request and track permissions, with search and filters.' },
            { label:'Reports', src:`${PR}w-reports.webp`, alt:'Monthly report table', caption:'Monthly reports to follow performance and trends.' }] },
          { type:'spotlight', label:'The key screen', title:'Warehouses at a glance', src:`${PR}s-dashboard.webp`, alt:'Warehouse dashboard: four colour-coded counts and a pie chart of this month’s best-moving items',
            items:['Out of stock, below reorder level, most bought and most used, as four colour-coded counts.',
                   'A chart of the categories that moved most this month.',
                   'Search and browse always at the bottom.'] },
          { type:'screens', grid:true, title:'More of the app', items:[
            { src:`${PR}s-items.webp`, title:'All items', text:'Every item with its code and quantity.' },
            { src:`${PR}s-search.webp`, title:'Search', text:'Pick a warehouse or search for an item.' },
            { src:`${PR}s-sort.webp`, title:'Sort and filter', text:'Most bought, price or quantity.' },
            { src:`${PR}s-about.webp`, title:'About', text:'Built by the governorate’s digital transformation team.' }] },
          { type:'palette', colors:[['Primary','#034A72'],['Text','#525458'],['Background','#F1F1F1'],['Alert','#CB3855'],['Teal','#32BDB4'],['Yellow','#E6B61C'],['Purple','#5553C9']],
            font:'Typefaces: Almarai for text, El Messiri for headings.' }
        ] },

      { id:'learn', nav:'What I learned', label:'Looking back', title:'What I learned',
        blocks:[
          { type:'learn', items:[
            'Going to the company first showed me how the work really happened.',
            'Back-office tools need structure before style. The information architecture came first.',
            'One platform can feel different on each device: full tables at the desk, quick counts on the phone.'] }
        ] }
    ] }
];
</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SITE = window.SITE, CASES = window.CASES;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- which project ---------------- */
let slug = null;
try { slug = new URLSearchParams(location.search).get('p'); } catch {}
let idx = Math.max(0, CASES.findIndex(c => c.slug === slug));
const P = CASES[idx], NEXT = CASES[(idx + 1) % CASES.length];
const link = c => `project.html?p=${encodeURIComponent(c.slug)}`;

document.title = `${P.title} · ${SITE.name}`;
$('#logo').textContent = SITE.firstName[0];
$('#here').textContent = SITE.firstName[0];
$('#here').title = `${SITE.firstName} is here`;
$('#crumb').textContent = P.title;
$('#cta').href = 'mailto:' + SITE.email;

/* analytics: which case study, and contact clicks from it */
track('case_study_viewed', { project:P.slug, title:P.title });
$('#cta').addEventListener('click', () => track('contact_clicked', { via:'contact_button', from:P.slug }));

/* light / dark toggle: starts from the system setting, the choice is remembered on every page */
const SUN = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>';
const MOON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.5 9.6A5.7 5.7 0 0 1 6.4 2.5a5.7 5.7 0 1 0 7.1 7.1Z"/></svg>';
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function paintThemeBtn(){ const d = isDark(), b = $('#themeBtn'); b.innerHTML = d ? SUN : MOON; b.title = b.ariaLabel = d ? 'Switch to light theme' : 'Switch to dark theme'; }
$('#themeBtn').onclick = () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('ng-theme', t); } catch {} paintThemeBtn(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeBtn);
paintThemeBtn();

/* ---------------- blocks ---------------- */
const FRAME_IC = '<svg width="10" height="10" viewBox="0 0 16 16"><path d="M5.5 1.5v13M10.5 1.5v13M1.5 5.5h13M1.5 10.5h13" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>';
const flabel = t => `<div class="flabel">${FRAME_IC}${esc(t || 'Key screens')}</div>`;
const frame = (b, inner, { pad = false, bare = false, cls = '' } = {}) =>
  `<div class="frame">${flabel(b.label)}${bare ? inner : `<div class="fbox${pad ? ' pad' : ''}${cls ? ' ' + cls : ''}"${b.bg ? ` style="background:${b.bg}"` : ''}>${inner}</div>`}${b.caption ? `<div class="fcap">${esc(b.caption)}</div>` : ''}</div>`;
const img = (src, alt) => `<img src="${esc(src)}" alt="${esc(alt || '')}" loading="lazy">`;
const flow = side => side.src ? img(side.src, side.cap)
  : `<div class="flow">${side.steps.map(s => `<span class="node${s === side.key ? ' key' : ''}">${esc(s)}</span>`).join('<span class="arr"></span>')}</div>`;

const phone = (src, alt) => `<div class="ph">${img(src, alt)}</div>`;
const chrome = url => `<div class="chrome"><div class="dots"><i></i><i></i><i></i></div>${url ? `<div class="url">${esc(url)}</div><div style="width:42px"></div>` : ''}</div>`;
const toggle = '<div class="seg" role="group" aria-label="View"><button aria-pressed="true" data-mode="side">Side by side</button><button aria-pressed="false" data-mode="slide">Slider</button></div>';

const BLOCKS = {
  facts:   b => `<div class="facts">${b.items.map(([k, v]) => `<div><span>${esc(k)}</span>${esc(v)}</div>`).join('')}</div>`,
  phones:  b => frame(b, `<div class="phones">${b.screens.map((s, i) => `<div class="phone${i === 1 ? ' mid' : ''}">${s}</div>`).join('')}</div>`),
  html:    b => frame(b, b.html),
  image:   b => frame(b, img(b.src, b.alt || b.caption), { cls:b.tall ? 'tall' : '' }),
  window:  b => `<div class="frame">${b.label ? flabel(b.label) : ''}<div class="win">${chrome(b.url)}${img(b.src, b.alt)}</div>${b.caption ? `<div class="fcap">${esc(b.caption)}</div>` : ''}</div>`,
  // numbered markers over a screenshot (x/y in % of the image), explained in a list below
  annotated: b => frame(b, img(b.src, b.alt) + b.points.map((p, i) => `<span class="mk" style="left:${p.x}%;top:${p.y}%" aria-hidden="true">${i + 1}</span>`).join(''), { cls:'anno' })
             + `<ol class="anno-list">${b.points.map(p => `<li>${esc(p.text)}</li>`).join('')}</ol>`,
  // same screen before and after: side by side by default, drag slider on request, "what changed" cards below
  pair:    b => `<div class="pairb" data-pair>
      <div class="pb-head"><div><h3>${esc(b.title)}</h3>${b.lede ? `<p>${esc(b.lede)}</p>` : ''}</div>${toggle}</div>
      <div class="pb-side">${[['Before', b.was || 'the old panel', b.before], ['After', b.now || 'the redesign', b.after]].map(([t, d, src]) =>
        `<figure><a href="${esc(src)}" target="_blank" rel="noopener" aria-label="${t}: ${esc(b.title)}, open full size"><div class="win">${chrome()}${img(src, `${t}: ${b.title}`)}</div></a><figcaption><b>${t}</b>${d}</figcaption></figure>`).join('')}</div>
      <div class="pb-slide"><div class="win">${chrome(b.url)}<div class="ba img">
        <div class="pane">${img(b.before, `Before: ${b.title}`)}<div class="cap">Before</div></div>
        <div class="pane after">${img(b.after, `After: ${b.title}`)}<div class="cap">After</div></div>
        <div class="handle"></div><div class="hint">Drag to compare</div>
        <input type="range" min="0" max="100" value="50" aria-label="Compare before and after: ${esc(b.title)}"></div></div></div>
      ${b.facts ? `<div class="pfacts">${b.facts.map(([was, now, why]) => `<div class="pfact"><div class="n"><s>${esc(was)}</s><i>→</i>${esc(now)}</div><p>${esc(why)}</p></div>`).join('')}</div>` : ''}
    </div>`,
  evolution: b => b.rows.map(r => `<h3 class="evo-h">${esc(r.title)}</h3><div class="evo">${r.stages.map(s =>
      `<figure><a class="thumb" href="${esc(s.src)}" target="_blank" rel="noopener">${img(s.src, s.alt || s.label)}</a><figcaption><span class="step">${s.n}</span>${esc(s.label)}</figcaption></figure>`).join('')}</div>
      ${r.note ? `<p class="evo-note">${r.lead ? `<b>${esc(r.lead)}</b> ` : ''}${esc(r.note)}</p>` : ''}`).join(''),
  rewrites: b => `<div class="rw">${b.items.map(([was, now, where]) => `<div class="rw-row">${where ? `<small>${esc(where)}</small>` : ''}<span class="old">${esc(was)}</span><span class="arrow" aria-hidden="true">→</span><span class="new">${esc(now)}</span></div>`).join('')}</div>`,
  gallery: b => `<div class="gal" style="--gc:${b.cols || 2}">${b.items.map(it => frame(it, img(it.src, it.alt || it.caption))).join('')}</div>`,
  funnel:  b => frame(b, `<div class="funnel">${b.rows.map(([n, v, hot]) =>
             `<div class="fr${hot ? ' hot' : ''}"><span>${esc(n)}</span><div class="track"><div class="fill" style="width:${+v}%"></div></div><b>${+v}%</b></div>`).join('')}</div>${b.legend ? `<div class="flegend">${esc(b.legend)}</div>` : ''}`, { pad:true }),
  quotes:  b => frame(b, `<div class="quotes">${b.items.map(([q, who, key]) => `<div class="q${key ? ' key' : ''}">${esc(q)}${who ? `<small>${esc(who)}</small>` : ''}</div>`).join('')}</div>`, { bare:true }),
  compare: b => { const im = !!(b.before.src && b.after.src);
             return frame(b, `<div class="ba${im ? ' img' : ''}"><div class="pane"><div class="cap">${esc(b.before.cap || 'Before')}</div>${flow(b.before)}</div>
               <div class="pane after"><div class="cap">${esc(b.after.cap || 'After')}</div>${flow(b.after)}</div>
               <div class="handle"></div><div class="hint">Drag to compare</div>
               <input type="range" min="4" max="96" value="50" aria-label="Compare before and after"></div>`); },
  caps:    b => `<div class="caps3${b.items.length === 4 ? ' c4' : ''}">${b.items.map(([t, d]) => `<div><b>${esc(t)}</b>${esc(d)}</div>`).join('')}</div>`,
  nums:    b => `<div class="nums">${b.items.map(([n, d]) => `<div><strong>${esc(n)}</strong><span>${esc(d)}</span></div>`).join('')}</div>`,
  learn:   b => `${b.heading ? `<h2>${esc(b.heading)}</h2>` : ''}<ul class="learn">${b.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`,
  // phone screenshots: a sideways strip (numbered flow) or a wrapping grid (states, decisions); click opens full size
  screens: b => `<div class="screens">${b.title ? `<h3>${esc(b.title)}</h3>` : ''}${b.lede ? `<p>${esc(b.lede)}</p>` : ''}
      <div class="${b.grid ? 'sgrid' : 'strip'}"${b.grid ? '' : ' tabindex="0" role="region" aria-label="' + esc(b.title || 'Screens') + ', scrolls sideways"'}>${b.items.map((it, i) =>
        `<figure>${phone(it.src, it.alt || it.title || it.text)}<figcaption>${b.grid ? '' : `<span class="step">${i + 1}</span>`}<span>${it.tag ? `<span class="tg${it.tone ? ' ' + it.tone : ''}">${esc(it.tag)}</span>` : ''}${it.title ? `<b>${esc(it.title)}</b>` : ''}${esc(it.text || '')}</span></figcaption></figure>`).join('')}</div></div>`,
  // three feature cards linking to their chapters
  features: b => `<div class="feat">${b.items.map((it, i) => `<a href="#${esc(it.id)}" data-jump="${esc(it.id)}">
      <div class="shot"><img src="${esc(it.src)}" alt="" loading="lazy"></div>
      <div class="fb"><small>${String(i + 1).padStart(2, '0')} · ${esc(it.kicker)}</small><b>${esc(it.title)}</b>${esc(it.text)}<em>Read the chapter →</em></div></a>`).join('')}</div>`,
  // design system: groups of component cards; each variant [file, state name] is shown at its design width w
  components: b => b.groups.map(gr => `<h3 class="dsg-h">${esc(gr.title)}</h3>${gr.text ? `<p class="dsg-p">${esc(gr.text)}</p>` : ''}
      <div class="dsg">${gr.items.map(it => `<div class="dsc${it.wide ? ' wide' : ''}"><div class="dsc-h"><b>${esc(it.name)}</b>${it.note ? `<span>${esc(it.note)}</span>` : ''}</div>
        <div class="dsv">${it.variants.map(([f, label, vw]) => `<figure>${img(b.dir + f + '.webp', `${it.name}${label ? ', ' + label : ''}`).replace('<img', `<img style="--w:${vw || it.w}"`)}${label ? `<figcaption>${esc(label)}</figcaption>` : ''}</figure>`).join('')}</div></div>`).join('')}</div>`).join(''),
  // the same section at several screen sizes, side by side at their relative widths
  sizes: b => `<div class="sizes">${b.items.map(it => `<figure style="flex:${it.w} 1 0"><div class="sz-shot">${img(it.src, it.alt || it.label)}</div><figcaption><b>${esc(it.label)}</b>${it.w}px</figcaption></figure>`).join('')}</div>`,
  // feature comparison: rows of [label, ...true/false], the last column highlighted
  table: b => `<div class="tblw"><table class="tbl"><thead><tr><th></th>${b.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(([label, ...v]) =>
      `<tr><th scope="row">${esc(label)}</th>${v.map(x => `<td class="${x ? 'y' : 'n'}" aria-label="${x ? 'Yes' : 'No'}">${x ? '✓' : '–'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${b.caption ? `<div class="fcap">${esc(b.caption)}</div>` : ''}`,
  // colour swatches + typeface note
  palette: b => `<div class="pal">${b.colors.map(([name, hex]) => `<div><i style="background:${esc(hex)}"></i><b>${esc(name)}</b><span>${esc(hex)}</span></div>`).join('')}</div>${b.font ? `<p class="pal-type">${esc(b.font)}</p>` : ''}`,
  // invitation to see the rest privately, mailing Noha
  cta: b => `<div class="ctab"><div><h3>${esc(b.title)}</h3><p>${esc(b.text)}</p></div>
      <a class="ctab-btn" href="mailto:${esc(SITE.email)}${b.subject ? '?subject=' + encodeURIComponent(b.subject) : ''}">${esc(b.button)}</a></div>`,
  // one phone with the reasoning beside it
  spotlight: b => `<div class="spot">${phone(b.src, b.alt)}<div><div class="flabel">${esc(b.label)}</div><h3>${esc(b.title)}</h3><ul class="learn">${b.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div></div>`
};
const block = b => (BLOCKS[b.type] || (() => ''))(b);

/* ---------------- page ---------------- */
const secs = P.sections;
const noteHtml = (s, cls = '') => s.note ? `<aside class="note${cls}"><div class="pin">${esc(SITE.firstName[0])}</div><div><div class="who">${esc(SITE.firstName)} <span>design note</span></div><p>${esc(s.note)}</p></div></aside>` : '';
const section = (s, i) => `<section class="sec${s.wide ? ' wide' : ''}" id="${esc(s.id)}">
  <div class="main">
    <div class="lbl">${i === 0 ? `Case study${P.sample ? ' <span class="tag">sample content</span>' : ''}` : esc(s.label || s.nav || '')}</div>
    ${i === 0 ? `<h1>${esc(s.title)}</h1>` : `<h2>${esc(s.title)}</h2>`}
    ${s.lede ? `<p class="lede">${esc(s.lede)}</p>` : ''}
    ${(s.text || []).map(t => `<p>${esc(t)}</p>`).join('')}
    ${s.wide ? noteHtml(s, ' inline') : ''}
    ${(s.blocks || []).map(block).join('')}
  </div>
  ${s.wide ? '' : noteHtml(s)}
</section>`;

$('#page').innerHTML = `<nav class="toc" id="toc" aria-label="Sections">${secs.map(s => `<a href="#${esc(s.id)}" data-id="${esc(s.id)}">${esc(s.nav || s.title)}</a>`).join('')}</nav>
  ${secs.map(section).join('')}
  ${CASES.length > 1 ? `<a class="nextp" href="${link(NEXT)}"><div><small>Next project</small><strong>${esc(NEXT.title)}</strong></div>
    <span class="go"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></a>` : ''}
  <div class="foot"><span class="wm">${esc(SITE.name.toLowerCase())}</span><span>${esc(SITE.role)}</span></div>
  <div class="cur" id="cur" aria-hidden="true">
    <svg width="17" height="19" viewBox="0 0 18 20"><path d="M1.5 1.5 16 9.3l-6.6 1.6-3.3 6.4Z" fill="#B06E4A" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span>${esc(SITE.firstName)}</span>
  </div>`;

const scroll = $('#scroll'), page = $('#page'), cur = $('#cur');
const secEls = [...document.querySelectorAll('.sec')];

/* table of contents */
const jump = id => document.getElementById(id).scrollIntoView({ behavior:reduced ? 'auto' : 'smooth', block:'start' });
$('#toc').addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return; e.preventDefault(); jump(a.dataset.id);
});
document.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); jump(a.dataset.jump); }));

/* active section + Noha's cursor next to its note */
let active = null;
function setActive(id){
  if (id === active) return; active = id;
  secEls.forEach(s => s.classList.toggle('on', s.id === id));
  document.querySelectorAll('#toc a').forEach(a => a.classList.toggle('on', a.dataset.id === id));
  moveCursor();
}
function moveCursor(){
  const s = document.getElementById(active); if (!s) return;
  const target = s.querySelector('.note') || s.querySelector('.main');
  const pr = page.getBoundingClientRect(), r = target.getBoundingClientRect();
  cur.style.transform = `translate(${r.right - pr.left - 26}px,${Math.min(r.bottom, r.top + 160) - pr.top - 10}px)`;
}
function onScroll(){
  const max = scroll.scrollHeight - scroll.clientHeight;
  $('#progress').style.width = (max > 0 ? scroll.scrollTop / max * 100 : 0) + '%';
  const mid = scroll.getBoundingClientRect().top + scroll.clientHeight * 0.4;
  let best = secEls[0];
  for (const s of secEls){ if (s.getBoundingClientRect().top <= mid) best = s; }
  if (scroll.scrollTop >= max - 4) best = secEls[secEls.length - 1];
  setActive(best.id);
  moveCursor();
}
scroll.addEventListener('scroll', onScroll, { passive:true });
window.addEventListener('resize', () => { moveCursor(); onScroll(); });

/* before / after sliders */
document.querySelectorAll('.ba').forEach(ba => {
  const inp = ba.querySelector('input');
  inp.addEventListener('input', () => ba.style.setProperty('--pos', inp.value + '%'));
});

/* pair view switch: side by side (default) or slider */
document.querySelectorAll('.ctab-btn').forEach(a => a.addEventListener('click', () => track('contact_clicked', { via:'get_in_touch', from:P.slug })));

document.querySelectorAll('[data-pair]').forEach(p => p.querySelectorAll('[data-mode]').forEach(btn => btn.addEventListener('click', () => {
  p.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === btn));
  p.classList.toggle('slide', btn.dataset.mode === 'slide'); moveCursor();
})));

/* images load after layout: keep the cursor on its note */
document.querySelectorAll('.page img').forEach(im => im.addEventListener('load', moveCursor));

if (location.hash){ const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
onScroll(); requestAnimationFrame(moveCursor);
})();
</script>
</body>
</html>
