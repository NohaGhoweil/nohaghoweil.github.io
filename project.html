<style>
:root{
  --bg:#F6F6F4; --dot:#E0E0DC; --panel:#FFFFFF; --ink:#1A2A28; --body:#4A5856; --muted:#8C9492; --line:#E7E5E1;
  --hover:#F1F1EF; --sel:#0D99FF; --frame:#FFFFFF; --frame-line:#ECEAE6;
  --pine:#1A2A28; --mint:#CEE8E3; --blush:#F7D1CD; --sand:#E9DCCE; --clay:#B06E4A; --note:#FFF3C4;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1C1D1D; --dot:#2E3030; --panel:#262828; --ink:#F1F2F1; --body:#C3C8C6; --muted:#8E9593;
    --line:#343737; --hover:#2F3232; --frame-line:#343737; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#1C1D1D; --dot:#2E3030; --panel:#262828; --ink:#F1F2F1; --body:#C3C8C6; --muted:#8E9593;
  --line:#343737; --hover:#2F3232; --frame-line:#343737; color-scheme:dark; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:3px;border-radius:4px}
.app{display:flex;flex-direction:column;height:100%}

/* ---------- top bar ---------- */
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:10;font-size:13px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--pine);color:var(--mint);font-weight:700;display:grid;place-items:center;font-size:14px;flex:none;text-decoration:none}
.back{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 6px;border-radius:6px;text-decoration:none;color:var(--ink);flex:none}
.back:hover{background:var(--hover)}
.crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:500}
.thm{width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.thm:hover{background:var(--hover)}
.here{position:relative;width:30px;height:30px;border-radius:50%;background:var(--clay);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.here::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#14AE5C;border:2px solid var(--panel)}
.cta{height:34px;padding:0 16px;border-radius:8px;background:var(--sel);color:#fff;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;flex:none}
.cta:hover{background:#0B87E0}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--sel);transition:width .1s linear}

/* ---------- canvas + grid ---------- */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:24px 24px}
.page{display:grid;grid-template-columns:168px minmax(0,700px) 250px;column-gap:56px;justify-content:center;padding:72px 32px 120px;position:relative}
.toc{grid-column:1;grid-row:1 / span 20;position:sticky;top:40px;align-self:start;font-size:13px}
.toc a{display:flex;align-items:center;gap:10px;padding:7px 0;color:var(--muted);text-decoration:none;transition:color .2s}
.toc a::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line);flex:none;transition:background .2s,transform .2s}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--ink);font-weight:500}
.toc a.on::before{background:var(--sel);transform:scale(1.3)}
.sec{scroll-margin-top:36px;grid-column:2 / 4;display:grid;grid-template-columns:minmax(0,700px) 250px;column-gap:56px;margin-bottom:112px;align-items:start}
.main{min-width:0}

/* ---------- type ---------- */
.lbl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:14px;transition:color .25s}
.lbl .tag{padding:2px 8px;border-radius:10px;background:var(--hover);color:var(--muted)}
.sec.on .lbl{color:var(--sel)}
h1{font-size:clamp(38px,6vw,60px);line-height:1.02;letter-spacing:-.035em;margin:0 0 20px;font-weight:700}
h2{font-size:clamp(26px,3.4vw,32px);line-height:1.15;letter-spacing:-.02em;margin:0 0 16px;font-weight:700}
.lede{font-size:clamp(18px,2.2vw,21px);line-height:1.55;color:var(--body);margin:0 0 36px;max-width:34em}
p{font-size:17px;line-height:1.7;color:var(--body);margin:0 0 18px;max-width:38em}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:48px;font-size:14.5px;line-height:1.45}
.facts span{display:block;color:var(--muted);font-size:12.5px;margin-bottom:3px}

/* ---------- frames ---------- */
.frame{margin-top:30px}
.facts + .frame{margin-top:0}
.frame .flabel{font-size:11.5px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.fbox{background:var(--frame);border:1px solid var(--frame-line);border-radius:4px;overflow:hidden;color:var(--pine)}
.fbox.pad{padding:clamp(20px,4vw,36px)}
.fbox > img{display:block;width:100%;height:auto}
.fcap{font-size:13px;color:var(--muted);margin-top:10px}
.gal{display:grid;grid-template-columns:repeat(var(--gc,2),minmax(0,1fr));gap:0 20px}

/* ---------- comment notes ---------- */
.note{position:sticky;top:36px;display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 4px 14px rgba(26,42,40,.05);margin-top:30px;font-size:14px;line-height:1.55;transition:border-color .3s,box-shadow .3s}
.sec.on .note{border-color:rgba(176,110,74,.45);box-shadow:0 8px 24px rgba(26,42,40,.08)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 4px;background:var(--clay);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.who{font-weight:600;font-size:12.5px;margin-bottom:3px}
.who span{font-weight:400;color:var(--muted);margin-left:4px}
.note p{font-size:14px;line-height:1.55;margin:0;color:var(--body)}

/* ---------- cursor ---------- */
.cur{position:absolute;left:0;top:0;pointer-events:none;z-index:5;transition:transform .5s cubic-bezier(.33,1,.68,1)}
.cur svg{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.cur span{position:absolute;left:15px;top:17px;padding:2px 8px;border-radius:4px 10px 10px 10px;background:var(--clay);color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap}

/* ---------- visuals (sample mockups) ---------- */
.phones{display:flex;justify-content:center;align-items:flex-end;gap:clamp(12px,3vw,28px);padding:40px 16px 0}
.phone{width:clamp(92px,20vw,152px);aspect-ratio:1/2.05;background:#fff;border:clamp(4px,.9vw,6px) solid var(--pine);border-radius:clamp(16px,3.4vw,26px);
  padding:clamp(20px,4.6vw,32px) clamp(7px,1.5vw,11px) clamp(7px,1.5vw,11px);position:relative;display:flex;flex-direction:column;gap:clamp(5px,1.1vw,8px);margin-bottom:-26px;box-shadow:0 18px 34px rgba(26,42,40,.14)}
.phone::before{content:"";position:absolute;top:clamp(7px,1.6vw,11px);left:50%;width:32%;height:clamp(4px,.9vw,6px);border-radius:4px;background:var(--pine);transform:translateX(-50%)}
.phone.mid{transform:translateY(-18px)}
.ln{height:5px;border-radius:3px;background:#EAE6DF;flex:none}.ln.s{width:55%}.ln.m{width:75%}
.blk{height:clamp(30px,7vw,50px);border-radius:8px;background:var(--mint);flex:none}
.opt{display:flex;align-items:center;gap:6px;padding:clamp(4px,1vw,7px) clamp(5px,1.1vw,8px);border-radius:8px;border:1.5px solid #E6E1D9;font-size:clamp(8px,1.5vw,11px);font-weight:600;white-space:nowrap;overflow:hidden;flex:none}
.opt i{width:9px;height:9px;border-radius:50%;border:2px solid var(--pine);flex:none}
.opt.on{border-color:var(--pine)}.opt.on i{background:var(--pine)}
.btn{margin-top:auto;height:clamp(18px,4.2vw,28px);border-radius:40px;background:var(--pine);color:#fff;font-size:clamp(8px,1.5vw,11px);font-weight:600;display:grid;place-items:center;flex:none}
.ok{width:46%;aspect-ratio:1;border-radius:50%;background:var(--mint);margin:8px auto 4px;display:grid;place-items:center;font-size:clamp(14px,3vw,22px);color:var(--pine)}
.ring{width:62%;aspect-ratio:1;border-radius:50%;margin:6px auto;background:conic-gradient(var(--clay) 0 68%,#EFE9E0 0);display:grid;place-items:center;flex:none}
.ring::after{content:"";width:72%;aspect-ratio:1;border-radius:50%;background:#fff}
.seg{display:flex;gap:4px;flex:none}.seg b{flex:1;height:6px;border-radius:3px;background:#EAE6DF}.seg b.on{background:var(--clay)}
.dsx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:clamp(22px,5vw,44px)}
.dsx div{background:#fff;border-radius:10px;padding:14px;display:grid;gap:9px;align-content:start;box-shadow:0 6px 16px rgba(26,42,40,.08)}
.dsx i{display:block;height:18px;border-radius:9px;background:var(--pine)}
.dsx i.o{background:transparent;border:2px solid var(--pine)}
.dsx i.m{background:var(--mint)}.dsx i.b{background:var(--blush)}.dsx i.c{background:var(--clay)}
.dsx i.f{border-radius:6px;background:transparent;border:2px solid #D9D4CB}

.funnel{display:grid;gap:14px}
.fr{display:grid;grid-template-columns:78px 1fr 44px;align-items:center;gap:14px;font-size:14px}
.fr .track{height:10px;border-radius:5px;background:#F1EFEB;overflow:hidden}
.fr .fill{height:100%;border-radius:5px;background:#A9CFC7}
.fr.hot{font-weight:600}
.fr.hot .fill{background:var(--clay)}
.fr b{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.fr.hot b{font-weight:700}
.flegend{margin-top:18px;font-size:13px;color:#7B8583}

.quotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.q{background:var(--note);color:#4A4128;padding:16px 16px 14px;font-size:14.5px;line-height:1.45;border-radius:2px;display:flex;flex-direction:column;justify-content:space-between;min-height:128px}
.q:nth-child(6n+2),.q:nth-child(6n+6){background:#DFF0EC;color:var(--pine)}
.q:nth-child(6n+3),.q:nth-child(6n+4){background:#FBE3E0;color:var(--pine)}
.q small{display:block;margin-top:10px;opacity:.6;font-size:12px}
.q.key{box-shadow:inset 0 0 0 2px var(--clay)}

.ba{position:relative;--pos:50%;user-select:none;background:#F7F5F1}
.ba .pane{padding:26px clamp(18px,4vw,34px) 44px}
.ba .after{position:absolute;inset:0;background:#EDF6F3;clip-path:inset(0 0 0 var(--pos))}
.ba .cap{font-size:12.5px;font-weight:600;color:#7B8583;margin-bottom:16px}
.after .cap{text-align:right;color:var(--pine)}
.ba.img .pane{padding:0}
.ba.img img{display:block;width:100%;height:auto}
.ba.img .after img{height:100%;object-fit:cover;object-position:top}
.ba.img .cap{position:absolute;top:12px;left:12px;margin:0;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.92);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.ba.img .after .cap{left:auto;right:12px}
.flow{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.after .flow{align-items:flex-end}
.node{padding:10px 14px;border-radius:8px;background:#fff;border:1.5px solid #DAD5CC;font-size:13.5px;font-weight:600;color:#6B7573}
.after .node{border-color:var(--pine);color:var(--pine)}
.after .node.key{background:var(--pine);color:#fff}
.arr{width:1.5px;height:12px;background:#C4BEB3;margin-left:30px;position:relative}
.after .arr{margin:0 30px 0 0;background:var(--pine)}
.arr::after{content:"";position:absolute;bottom:-3px;left:-3.5px;border:4px solid transparent;border-top:5px solid #C4BEB3;border-bottom:0}
.after .arr::after{border-top-color:var(--pine)}
.ba .handle{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;background:var(--sel);transform:translateX(-1px);pointer-events:none}
.ba .handle::after{content:"";position:absolute;top:50%;left:50%;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--sel);transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.ba .handle::before{content:"";position:absolute;top:50%;left:50%;width:10px;height:2px;background:var(--sel);transform:translate(-50%,-50%);z-index:1;box-shadow:0 -4px 0 var(--sel),0 4px 0 var(--sel)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.ba .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;color:#8C9492;pointer-events:none}
.ba.img .hint{bottom:12px;left:50%;right:auto;transform:translateX(-50%);padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.92)}

.caps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px;font-size:13.5px;line-height:1.5;color:var(--body)}
.caps3 b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}

.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:8px 0 40px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.nums div{padding:26px 20px 24px}
.nums div + div{border-left:1px solid var(--line)}
.nums strong{display:block;font-size:clamp(34px,5vw,46px);letter-spacing:-.035em;line-height:1;margin-bottom:10px;font-weight:700}
.nums span{font-size:14px;color:var(--body);line-height:1.45;display:block}
.learn{list-style:none;padding:0;margin:0;display:grid;gap:14px;max-width:38em}
.learn li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:16.5px;line-height:1.6;color:var(--body)}
.learn li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--clay);margin-top:10px}

.nextp{grid-column:2 / 3;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px 32px;background:var(--pine);color:#fff;border-radius:6px;text-decoration:none;transition:transform .25s}
.nextp:hover{transform:translateY(-2px)}
.nextp small{display:block;color:var(--mint);font-size:13px;margin-bottom:6px}
.nextp strong{font-size:clamp(22px,3vw,28px);letter-spacing:-.02em}
.nextp .go{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none;transition:background .25s}
.nextp:hover .go{background:var(--mint);color:var(--pine)}
.foot{grid-column:2 / 3;display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:40px;font-size:13px;color:var(--muted)}
.wm{font-weight:700;color:var(--ink);font-size:15px;padding-bottom:3px;border-bottom:2px solid var(--clay)}

/* ---------- wide sections (pairs, evolution) use the full width; their note sits inline ---------- */
.page .sec.wide{grid-template-columns:minmax(0,1fr)}
.note.inline{position:static;max-width:560px;margin:22px 0 0}
.fbox{position:relative}
.fbox.tall{max-height:min(720px,80vh);overflow:auto;overscroll-behavior:contain}

/* ---------- browser window frame ---------- */
.win{border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 24px 50px -24px rgba(0,0,0,.4)}
.chrome{height:34px;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px;flex:none}.dots i{width:10px;height:10px;border-radius:50%;background:#FF5F57}.dots i:nth-child(2){background:#FEBC2E}.dots i:nth-child(3){background:#28C840}
.url{flex:1;min-width:0;max-width:380px;margin:0 auto;height:22px;line-height:22px;padding:0 10px;border-radius:6px;background:var(--bg);color:var(--muted);font-size:11.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win > img{display:block;width:100%;height:auto;background:#fff}

/* ---------- before / after pair: side by side by default, slider on request ---------- */
.pairb{margin-top:60px}
.pb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.pb-head h3{margin:0;font-size:21px;letter-spacing:-.015em}
.pb-head p{margin:4px 0 0;font-size:15px;color:var(--body);max-width:none}
.seg{display:inline-grid;grid-auto-flow:column;gap:2px;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:500;height:30px;padding:0 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pb-side{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pb-side figure{margin:0}.pb-side a{display:block;color:inherit;text-decoration:none}
.pb-side a:hover .win{border-color:var(--sel)}
.pb-side figcaption{margin-top:8px;font-size:13px;color:var(--muted)}.pb-side figcaption b{color:var(--ink);margin-right:5px}
.pb-slide{display:none}
.pairb.slide .pb-side{display:none}.pairb.slide .pb-slide{display:block}
.pfacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.pfact{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.pfact .n{font-size:14.5px;font-weight:600;line-height:1.4}
.pfact .n s{display:block;color:var(--muted);font-weight:500;text-decoration-color:rgba(176,110,74,.7);margin-bottom:2px}
.pfact .n i{font-style:normal;color:var(--clay);margin-right:5px}
.pfact p{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--body)}

/* ---------- annotated screenshot ---------- */
.anno .mk{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--clay);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(176,110,74,.28),0 4px 10px rgba(0,0,0,.25)}
.anno-list{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px;counter-reset:a;max-width:38em}
.anno-list li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:15.5px;line-height:1.55;color:var(--body)}
.anno-list li::before{counter-increment:a;content:counter(a);width:22px;height:22px;border-radius:50%;background:var(--clay);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}

/* ---------- design evolution ---------- */
.evo-h{font-size:16px;margin:34px 0 10px}
.evo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.evo figure{margin:0}
.evo .thumb{display:block;aspect-ratio:16/11;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:#fff;box-shadow:0 10px 24px -14px rgba(0,0,0,.35);transition:transform .2s}
.evo .thumb:hover{transform:translateY(-3px)}
.evo .thumb img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.evo figcaption{margin-top:8px;font-size:13px;color:var(--body);display:flex;align-items:center;gap:8px}
.step{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.evo-note{margin:12px 0 0;font-size:15px;line-height:1.6;color:var(--body);max-width:70ch}
.evo-note b{color:var(--ink)}

/* ---------- UX writing rewrites ---------- */
.rw{margin-top:22px;display:grid;gap:10px}
.rw-row{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);align-items:center;gap:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.rw-row small{grid-column:1 / -1;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.rw-row .old{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(176,110,74,.6);overflow-wrap:anywhere}
.rw-row .arrow{color:var(--clay);text-align:center}
.rw-row .new{font-size:15px;font-weight:600;line-height:1.45;color:var(--ink)}
.caps3.c4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ---------- phone screens: feature cards, flow strips, state grids, spotlight ---------- */
.ph{display:block;aspect-ratio:375/812;border:5px solid #16191D;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--frame-line),0 18px 34px -20px rgba(10,40,70,.5);transition:transform .2s}
.ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
a.ph:hover{transform:translateY(-3px)}
.screens{margin-top:44px}
.screens h3{margin:0 0 4px;font-size:19px;letter-spacing:-.01em}
.screens > p{margin:0;font-size:15px;color:var(--body)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(150px,40vw,184px);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 2px 14px;overscroll-behavior-x:contain;scrollbar-width:thin}
.strip figure{scroll-snap-align:start}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,220px));gap:26px 20px;padding-top:18px}
.screens figure{margin:0;min-width:0}
.screens figcaption{margin-top:10px;font-size:13px;line-height:1.45;color:var(--body);display:flex;gap:8px;align-items:flex-start}
.screens figcaption b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.screens .step{margin-top:1px}
.tg{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;margin-bottom:4px;background:#FBE3E0;color:#A4372B}
.tg.t-ok{background:#DFF0EC;color:#1E6B5C}.tg.t-info{background:#E2ECF6;color:#00578A}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:30px}
.feat a{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s}
.feat a:hover{border-color:var(--sel);transform:translateY(-2px)}
.feat .shot{height:170px;overflow:hidden;background:#DCE7F1;display:flex;justify-content:center;padding-top:22px}
.feat .shot img{width:136px;align-self:flex-start;border:4px solid #16191D;border-bottom:0;border-radius:20px 20px 0 0;display:block}
.feat .fb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1;font-size:14px;line-height:1.5;color:var(--body)}
.feat small{font-size:12px;color:var(--muted)}
.feat b{color:var(--ink);font-size:16px;line-height:1.3}
.feat em{font-style:normal;color:var(--sel);font-weight:500;font-size:13px;margin-top:auto;padding-top:6px}
.spot{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:clamp(24px,5vw,56px);align-items:center;margin-top:36px;padding:clamp(22px,4vw,40px);background:#E8F0F7;border-radius:16px;color:#1A2A28}
.spot .flabel{color:#00578A;font-size:12px;font-weight:600;margin-bottom:8px}
.spot h3{margin:0 0 14px;font-size:clamp(22px,2.6vw,28px);letter-spacing:-.02em}
.spot .learn li{color:#3D4B49}
.spot .learn li::before{background:#00578A}

/* ---------- components: one light card per component, variants shown at 1× with their state names ---------- */
.dsg-h{margin:44px 0 4px;font-size:19px;letter-spacing:-.01em}
.dsg-p{margin:0 0 16px;font-size:15px;color:var(--body)}
.dsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:16px;grid-auto-flow:dense}
.dsc{background:#F4F6F8;border:1px solid var(--frame-line);border-radius:14px;padding:18px 18px 20px;color:#1A2A28;min-width:0}
.dsc.wide{grid-column:1 / -1}
.dsc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:16px}
.dsc-h b{font-size:15px}
.dsc-h span{font-size:12px;color:#6B7573;white-space:nowrap}
.dsv{display:flex;flex-wrap:wrap;gap:16px 14px;align-items:flex-start}
.dsv figure{margin:0;max-width:100%}
.dsv img{display:block;width:calc(var(--w) * 1px);max-width:100%;height:auto}
.dsv figcaption{margin-top:6px;font-size:11.5px;color:#6B7573}
.sizes{display:flex;align-items:flex-end;gap:clamp(10px,2vw,22px);margin-top:28px}
.sizes figure{margin:0;min-width:0}
.sz-shot{border-radius:10px;overflow:hidden;border:1px solid var(--frame-line);box-shadow:0 18px 34px -22px rgba(0,0,0,.5)}
.sz-shot img{display:block;width:100%;height:auto}
.sizes figcaption{margin-top:8px;font-size:12.5px;color:var(--muted)}
.sizes figcaption b{color:var(--ink);font-weight:600;margin-right:6px}
.tblw{margin-top:24px;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
.tbl th,.tbl td{padding:12px 14px;text-align:center;border-bottom:1px solid var(--line)}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}
.tbl thead th{font-weight:600;color:var(--ink);font-size:13px}
.tbl tbody th{text-align:left;font-weight:500;color:var(--body)}
.tbl td.y{color:#1E6B5C;font-weight:700}.tbl td.n{color:var(--muted)}
.tbl th:last-child,.tbl td:last-child{background:rgba(26,126,193,.08);color:#1A7EC1}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;margin-top:24px}
.pal div{font-size:13px;color:var(--body)}
.pal i{display:block;height:64px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px}
.pal b{display:block;color:var(--ink);font-weight:600}
.pal-type{font-size:15px;margin-top:16px}
.ctab{margin-top:44px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 30px;border-radius:16px;background:var(--pine);border:1px solid var(--line);color:#fff}
.ctab h3{margin:0 0 6px;font-size:22px;letter-spacing:-.015em}
.ctab p{margin:0;font-size:15px;line-height:1.6;color:#C9DCD8;max-width:56ch}
.ctab-btn{flex:none;height:44px;padding:0 22px;border-radius:22px;background:#fff;color:var(--pine);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;transition:background .2s}
.ctab-btn:hover{background:var(--mint)}

@media (max-width: 1200px){
  .page{grid-template-columns:minmax(0,700px) 230px;column-gap:44px}
  .toc{display:none}
  .sec{grid-column:1 / 3;grid-template-columns:minmax(0,700px) 230px;column-gap:44px}
  .nextp,.foot{grid-column:1 / 2}
}
@media (max-width: 920px){
  .page{grid-template-columns:minmax(0,1fr);padding:44px 20px 90px}
  .sec{grid-column:1;grid-template-columns:minmax(0,1fr);margin-bottom:80px}
  .nextp,.foot{grid-column:1}
  .note{margin-top:20px;position:static}
  .cur{display:none}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .crumb{display:none}
  .thm{margin-left:auto}
  .pfacts,.caps3.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .feat{grid-template-columns:1fr}
  .feat a{flex-direction:row}
  .feat .shot{height:auto;width:118px;flex:none;padding:0;position:relative}
  .feat .shot img{position:absolute;top:16px;left:13px;width:92px;border-width:3px;border-radius:14px 14px 0 0}
}
@media (max-width: 560px){
  .quotes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .caps3{grid-template-columns:1fr}
  .nums{grid-template-columns:1fr}
  .nums div + div{border-left:0;border-top:1px solid var(--line)}
  .back span{display:none}
  .gal{grid-template-columns:1fr}
  .dsx{grid-template-columns:1fr 1fr}
  .pb-side,.evo{grid-template-columns:1fr}
  .caps3.c4{grid-template-columns:1fr}
  .rw-row{grid-template-columns:1fr}
  .rw-row .arrow{text-align:left;transform:rotate(90deg);width:14px}
  .sgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
  .spot{grid-template-columns:1fr}
  .spot > .ph{width:200px;justify-self:center}
  .ctab{flex-direction:column;align-items:flex-start;padding:24px 22px}
  .sizes{flex-wrap:wrap}
  .sizes figure:first-child{flex-basis:100% !important}
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{transition:none!important;animation:none!important} }
</style>

<body>
<div class="app">
  <header class="topbar">
    <a class="logo" href="index.html#work" id="logo" aria-label="Home"></a>
    <a class="back" href="index.html#work">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg><span>All work</span>
    </a>
    <div class="crumb">Portfolio / <b id="crumb"></b></div>
    <button class="thm" id="themeBtn"></button>
    <div class="here" id="here"></div>
    <a class="cta" id="cta">Contact</a>
    <div class="progress" id="progress"></div>
  </header>

  <div class="scroll" id="scroll">
    <div class="page" id="page"></div>
  </div>
</div>

<script>
/* =====================================================================
   CASE STUDIES — one entry per project, in the same order as the cards
   on the home page. `slug` must match the project's slug in index.html.

   A project is a list of sections. Each section can have:
     id, nav (name in the side menu), label (small text above the heading),
     title, lede, text: [paragraphs], blocks: [...], note (Noha's side comment)
   The first section is the overview: its title is the big page heading.

   Block types:
     { type:'facts', items:[['Role','…'], …] }
     { type:'image', label, src, alt, caption, bg }           one screenshot
     { type:'gallery', cols:2, items:[{ label, src, alt, caption }, …] }
     { type:'compare', label, before:{ cap, src | steps:[…] }, after:{ cap, src | steps:[…], key } }
     { type:'quotes', label, items:[['quote','who', key?], …] }
     { type:'funnel', label, rows:[['Step', percent, highlight?], …], legend }
     { type:'caps', items:[['Title','text'], …] }
     { type:'nums', items:[['−30%','what it means'], …] }
     { type:'learn', heading, items:['…', …] }
     { type:'window', url, src, alt, caption }                   screenshot in a browser frame
     { type:'annotated', label, src, points:[{ x, y, text }] }     numbered markers (x/y in %) + list
     { type:'pair', title, lede, url, before, after, was, now, facts:[[was, now, why]] }   side by side, slider on request (was/now: captions)
     { type:'evolution', rows:[{ title, stages:[{ n, label, src }], lead, note }] }
     { type:'rewrites', items:[['old wording', 'new wording', 'where'], …] }
     { type:'image', tall:true, … }                               long page that scrolls inside its frame
     { type:'screens', title, lede, grid?, items:[{ src, title, text, tag, tone }] }   phone screens: sideways strip, or grid:true
     { type:'features', items:[{ id, kicker, title, text, src }] }   cards that jump to the section with that id
     { type:'spotlight', label, title, src, alt, items:['…'] }       one phone with points beside it
     { type:'cta', title, text, button, subject }                    "get in touch" card that emails Noha
     { type:'sizes', items:[{ src, label, w }] }                    one section at several widths, side by side
     { type:'table', cols:['A','B'], rows:[['Feature', true, false]], caption }   comparison table, last column highlighted
     { type:'palette', colors:[['Primary','#1A7EC1']], font:'Typeface note' }     colour swatches
     { type:'components', dir, groups:[{ title, text, items:[{ name, note, w, wide?, variants:[['file','state', w?], …] }] }] }
     Section option wide:true = full width, note shown inline (for pairs and evolution)
     { type:'phones' | 'html', … }                             drawn sample mockups
   ===================================================================== */
window.SITE = { name:'Noha Ghoweil', firstName:'Noha', role:'Senior UI/UX designer', email:'nohaghoweil@gmail.com' };

const PHONE = {
  cart:  '<div class="blk"></div><div class="ln"></div><div class="ln s"></div><div class="ln m"></div><div class="btn">Continue</div>',
  pick:  '<div class="ln s"></div><div class="opt"><i></i>Card 4821</div><div class="opt"><i></i>Wallet</div><div class="opt on"><i></i>Installments</div><div class="btn">Pay EGP 4,800</div>',
  done:  '<div class="ok">✓</div><div class="ln"></div><div class="ln s"></div><div class="seg"><b class="on"></b><b></b><b></b></div><div class="btn">Done</div>',
  plan:  '<div class="ln s"></div><div class="seg"><b class="on"></b><b></b><b></b></div><div class="ln"></div><div class="ln s"></div><div class="btn">Confirm plan</div>',
  ring:  '<div class="ring"></div><div class="ln"></div><div class="ln s"></div><div class="btn">Check in</div>',
  list:  '<div class="ln s"></div><div class="blk"></div><div class="ln"></div><div class="ln m"></div><div class="ln s"></div><div class="btn">Open</div>'
};

const BM = 'assets/projects/baymax/';          // screens for the BayMax app case study
const IT = 'assets/projects/issue-tracker/';   // screens for the Employees Issue Tracker case study
const CE = 'assets/projects/citizen-eye/';     // mockups for the Citizen Eye app
const CO = 'assets/projects/citizen-eye-officials/';   // mockup for Citizen Eye for Officials
const SW = 'assets/projects/sono-women/';      // mockups for the Sono Women app
const AQ = 'assets/projects/aqeelah/';         // pages for the Al-Aqeelah website redesign task
const CA = 'assets/projects/comave/';          // screens for the ComAve login and account pages
const PR = 'assets/projects/prime/';           // screens for the Prime water company platform

window.CASES = [
  { slug:'baymax', title:'Less paperwork, more patient time',
    sections:[
      { id:'overview', nav:'Overview', title:'Less paperwork, more patient time',
        lede:'An Arabic employee app for hospital staff: attendance, leave, payslips and salary advances in one place.',
        blocks:[
          { type:'facts', items:[['Role','UI/UX designer · freelance'],['Year','2024'],['Platform','Mobile · Arabic, right to left'],['Scope','31 screens, research to UI']] },
          { type:'image', label:'BayMax app', src:`${BM}cover-mockup.webp`, alt:'Three BayMax screens in Arabic: payslip details, the home screen with services, and notifications' }
        ],
        note:'A freelance project for a hospital-software client. The full original case study is on my Behance.' },

      { id:'problem', nav:'The problem', label:'The problem', title:'Admin was eating into care time',
        text:['Doctors and nurses handled attendance, leave, salary questions and documents through paper forms, calls and messages. It was slow, easy to get wrong, and it took time away from patients.',
              'BayMax brings all of it into one app, written right to left in Arabic for the people who use it.'],
        blocks:[
          { type:'rewrites', items:[
            ['Attendance tracked by hand, with errors', 'Automatic attendance tracking', 'Attendance'],
            ['Leave requests got lost or delayed', 'One leave flow with a clear status', 'Leave'],
            ['Salary details were unclear', 'A monthly payslip with every deduction', 'Payslip'],
            ['Requests went through calls and messages', 'Requests and chat with the manager in the app', 'Requests'],
            ['Documents spread across files', 'Documents and profile in one place', 'Profile'],
            ['Updates missed in group chats', 'One notification centre', 'Notifications']] }
        ],
        note:'Every problem here became one service on the home screen.' },

      { id:'users', nav:'Who it’s for', label:'Who it’s for', title:'A doctor with no time for forms',
        text:['I talked to a few hospital staff and combined that with online research into one persona: Mohammed, a 32-year-old general practitioner in Cairo. He wants admin to take minutes, not hours, so he can focus on his patients.',
              'Problem statement: Mohammed needs to spend more time on patient care, because manual admin is slow and full of mistakes.'],
        blocks:[
          { type:'caps', items:[
            ['Thinks','“I need a tool that saves time, not one more thing to learn.”'],
            ['Feels','Overwhelmed by paperwork, and worried about work-life balance.'],
            ['Says','“I want leave and attendance to be simple, and salary to be clear.”'],
            ['Does','Spends extra hours on admin and tries new tools to keep up.']] }
        ],
        note:'A proto-persona, built from a few conversations and online research.' },

      { id:'research', nav:'Research', label:'Research', title:'What others were missing',
        text:['I compared three HR apps to see what staff already expect, and where there was room to do better.'],
        blocks:[
          { type:'table', cols:['ZenHR','TimeDoctor','Software Fish','BayMax'], rows:[
            ['Onboarding', true, true, true, true],
            ['Personal home screen', true, true, true, true],
            ['Chat with managers', false, true, false, true],
            ['Announcements', true, false, true, true]],
            caption:'Chat with a manager was the clearest gap: only one of the three offered it.' },
          { type:'caps', items:[
            ['Requesting leave','Show the request status clearly, and let staff add a note.'],
            ['Checking a payslip','Let staff download it, and break down every deduction.'],
            ['Chatting with a manager','Add read receipts, so nobody wonders if a message was seen.'],
            ['Updating the profile','Edit several fields at once, and confirm big changes.']] }
        ],
        note:'The journey map turned each task into one improvement I designed for.' },

      { id:'process', nav:'Process', label:'Process', title:'From paper to pixels', wide:true,
        text:['I started with paper sketches in Arabic, moved to grey wireframes to settle the layouts, then built a small style guide and the final screens.'],
        blocks:[
          { type:'image', label:'Paper sketches', src:`${BM}sketches.webp`, alt:'Hand-drawn Arabic phone sketches: home, chat, profile, leave and messages' },
          { type:'image', label:'Wireframes', src:`${BM}wireframes.webp`, alt:'Grey wireframes of the profile, documents, leave and payslip screens' },
          { type:'palette', colors:[['Primary','#1A7EC1'],['Secondary','#EEF2FF'],['Text','#4E485E'],['Text, light','#858585'],['Text, faint','#C0C0C0'],['Alert','#E45D32'],['Weather','#F9E539']],
            font:'Typeface: Nahdi, an Arabic font, in a small set of heading and body sizes.' },
          { type:'image', label:'A few components', src:`${BM}components.webp`, alt:'Components: the bottom navigation in its states, attachment rows and notification items' }
        ] },

      { id:'design', nav:'Final design', label:'Final design', title:'The final screens', wide:true,
        text:['A calm blue interface with every service one tap from home. Right-to-left from the first sketch, so nothing feels translated.'],
        blocks:[
          { type:'spotlight', label:'The key screen', title:'Home: every service, one tap away', src:`${BM}screen-home.webp`, alt:'Home screen: greeting with the weather, a search bar, and nine service tiles',
            items:['A greeting with the date and the weather in the staff member’s city.',
                   'Nine services as large tiles: advances, leave, permissions, payslip, requests, tasks and more.',
                   'Notifications and chat always in the bottom bar.'] },
          { type:'image', label:'Final design', src:`${BM}final-a.webp`, alt:'Final blue screens: home, documents, profile and payslip' },
          { type:'image', label:'More screens', src:`${BM}final-b.webp`, alt:'More final screens: leave, sign up, request details, profile, salary advance and onboarding' }
        ] },

      { id:'learn', nav:'What I learned', label:'Looking back', title:'What I learned',
        blocks:[
          { type:'learn', items:[
            'Designing right to left from the first sketch is easier than flipping a finished design.',
            'For busy staff, the best feature is the one that takes the fewest taps.',
            'Simple and complete pull against each other. Every service had to earn its tile.'] },
          { type:'learn', heading:'What I’d do next', items:[
            'Run usability tests with doctors and nurses on real tasks.',
            'Connect the app to the hospital’s HR and payroll systems.',
            'Add more HR features, such as shift swaps.'] }
        ] }
    ] },

  { slug:'citizen-eye', title:'Take a photo, report the problem',
    sections:[
      { id:'overview', nav:'Overview', title:'Take a photo, report the problem',
        lede:'Citizen Eye (عين المواطن) lets anyone in Aswan Governorate photograph a problem in the street, report it in a few taps, and confirm when it’s fixed.',
        blocks:[
          { type:'facts', items:[['Role','UI/UX designer'],['Team','Aswan Digital Transformation Center'],['Platform','Android app · Arabic'],['Status','Launched']] },
          { type:'image', label:'Citizen Eye', src:`${CE}cover-mockup.webp`, alt:'Citizen Eye screens in Arabic: “Take a photo now”, the splash screen, a fix to confirm, the report form and a map pin' }
        ],
        note:'Made at the Aswan Digital Transformation Center. It went live, together with its sister app for officials.' },

      { id:'loop', nav:'The idea', label:'The idea', title:'A loop with the citizen at both ends',
        text:['Citizen Eye is for anyone in the governorate. Its sister app, Citizen Eye for Officials, is for the people who fix what gets reported. The same report travels through both apps:'],
        blocks:[
          { type:'caps', items:[
            ['1 · The citizen reports','A photo, what the problem is, the city, and a pin on the map.'],
            ['2 · Officials fix it','Every report on a dashboard, a list and a map, then fixed on site.'],
            ['3 · The citizen confirms','The citizen sees the fix and taps “Solved” or “Not solved”.']] }
        ],
        note:'The citizen gets the last word on whether a problem is really fixed.' },

      { id:'citizen', nav:'Citizen app', label:'Citizen Eye', title:'One button: take a photo', wide:true,
        text:['Anyone in the governorate can use it, so the home screen has one job: take a photo. After that, every step is a choice from a list or a tap on the map, with no forms to type.'],
        blocks:[
          { type:'image', label:'Citizen Eye', src:`${CE}citizen.webp`, alt:'Citizen Eye screens: about, home with a camera button, splash, before and after photos, a fix to confirm, report sent, report form, map pin and notifications' },
          { type:'caps', items:[
            ['Take the photo','One big camera button on the home screen.'],
            ['Say what it is','The violation type, then a category such as garbage piles or sidewalk encroachment.'],
            ['Say where','The city from a list, then the exact spot on a satellite map.'],
            ['Sent','A clear confirmation. Every report is recorded confidentially.']] },
          { type:'gallery', cols:2, items:[
            { label:'Start', src:`${CE}citizen-start.webp`, alt:'About page, home with “Take a photo now”, the splash screen and before and after photos', caption:'Splash, home and the before and after photos of a fixed report.' },
            { label:'Report and confirm', src:`${CE}citizen-report.webp`, alt:'A notification with the photo of the fix and Confirm solved and Not solved buttons, the report form and the map pin', caption:'The report form, the map pin, and the notification asking the citizen to confirm the fix.' }] }
        ] },

      { id:'results', nav:'Results', label:'Results', title:'Used across Aswan',
        text:['By 22 April 2024, citizens had sent 768 reports through the app, and 648 of them were solved.'],
        note:'The numbers come from the officials’ dashboard in Citizen Eye for Officials.' },

      { id:'learn', nav:'What I learned', label:'Looking back', title:'What I learned',
        blocks:[
          { type:'learn', items:[
            'For a public app, one obvious action beats a menu of options.',
            'Letting citizens confirm the fix turned a complaint box into a feedback loop.',
            'Choices from a list and a pin on a map beat a form that people have to type.'] }
        ] }
    ] },

  { slug:'citizen-eye-officials', title:'Every report, on one screen',
    sections:[
      { id:'overview', nav:'Overview', title:'Every report, on one screen',
        lede:'Citizen Eye for Officials (عين المواطن للتنفيذيين) gives the officials of Aswan Governorate every citizen report on a dashboard, a list and a map, so they can fix problems and see how well they’re responding.',
        blocks:[
          { type:'facts', items:[['Role','UI/UX designer'],['Team','Aswan Digital Transformation Center'],['Platform','Android app · Arabic'],['Status','Launched']] },
          { type:'image', label:'Citizen Eye for Officials', src:`${CO}cover-mockup.webp`, alt:'Officials app: a list of photo reports, the dashboard with totals and a chart by category, and a map of Aswan full of report pins' }
        ],
        note:'The sister app of Citizen Eye, made at the Aswan Digital Transformation Center. Both went live.' },

      { id:'problem', nav:'The job', label:'The job', title:'From a pile of reports to a plan',
        text:['Citizens send reports with a photo, a category, the city and a pin on the map. The officials who fix them need three things: what needs doing, where it is, and whether the work is getting done.'],
        blocks:[
          { type:'caps', items:[
            ['What needs doing','Reports by status, newest first, with the photo and the place.'],
            ['Where it is','Every report on a map of the governorate.'],
            ['How it’s going','Totals, the response rate, and the fixes citizens rejected.']] }
        ],
        note:'Citizens confirm each fix in their own app, so a “solved” report really is solved.' },

      { id:'design', nav:'The app', label:'The app', title:'Three views of the same reports', wide:true,
        text:['Three tabs at the bottom: the dashboard, the list of reports and the map.'],
        blocks:[
          { type:'gallery', cols:3, items:[
            { label:'Dashboard', src:`${CO}s-dashboard.webp`, alt:'Dashboard: 768 reports, 648 solved, 118 not solved, 84% response rate, 24 rejected by citizens, and a chart by category', caption:'Total, solved and unsolved reports, the response rate, the fixes citizens rejected, and a chart by category.' },
            { label:'Reports', src:`${CO}s-reports.webp`, alt:'Reports list: photo cards with the place and time, chat and map buttons, and tabs for not handled, rejected and solved', caption:'Photo cards with the place and time, tabs for not handled, rejected and solved, and quick chat and map buttons.' },
            { label:'Map', src:`${CO}s-map.webp`, alt:'Map of Aswan with red pins for every report along the Nile', caption:'Every report pinned across Aswan, so it’s easy to see where problems cluster.' }] }
        ] },

      { id:'results', nav:'Results', label:'Results', title:'In use across Aswan',
        text:['From the officials’ dashboard on 22 April 2024:'],
        blocks:[
          { type:'nums', items:[['768','reports sent by citizens'],['648','solved'],['84%','response rate']] }
        ],
        note:'24 fixes were rejected by the citizens who reported them. Officials could only see that because citizens confirm each fix.' },

      { id:'learn', nav:'What I learned', label:'Looking back', title:'What I learned',
        blocks:[
          { type:'learn', items:[
            'The same report needs two very different apps: one to send and check it, one to act on it.',
            'A few big numbers up front tell officials how they’re doing before they dive into the list.',
            'A map shows patterns a list never will, like which neighbourhoods need attention.'] }
        ] }
    ] },

  { slug:'sono-women', title:'A journey, not a manual',
    sections:[
      { id:'overview', nav:'Overview', title:'A journey, not a manual',
        lede:'Sono Women is an Arabic app that walks women in Aswan through starting a business, from the first idea to growing it.',
        blocks:[
          { type:'facts', items:[['Role','UI/UX designer · illustrations with AI tools'],['Team','ISDT, Aswan Governorate'],['Platform','Mobile app · Arabic'],['Focus','Women entrepreneurs, green projects']] },
          { type:'image', label:'Sono Women', src:`${SW}cover-mockup.webp`, alt:'Sono Women screens: the home page, choosing guidance, the growth stage, role models and the journey stages' }
        ],
        note:'Designed for ISDT, the information systems and digital transformation team of Aswan Governorate.' },

      { id:'journey', nav:'The journey', label:'The journey', title:'Start where you are',
        text:['A guide to starting a business can feel like a wall of text. So instead of one long manual, the app asks “Which stage of the journey are you at?” and opens a page for that stage, with a short explanation and numbered steps.'],
        blocks:[
          { type:'caps', items:[
            ['Thinking','Turning an idea into a first concept that meets a real need in the market.'],
            ['Planning','Shaping the idea into a plan before spending money.'],
            ['Execution','Building the team, launching sustainable products, marketing and selling.'],
            ['Growth','Expanding the product range and hiring.']] },
          { type:'gallery', cols:2, items:[
            { label:'Home, guidance and stages', src:`${SW}screens-journey.webp`, alt:'Home with “Your first step toward entrepreneurship”, choosing the type of guidance, the growth stage page, role models, strategy and the stage picker', caption:'Home, the two kinds of guidance, the stage picker and a stage page.' },
            { label:'Stage pages and project models', src:`${SW}screens-stages.webp`, alt:'The thinking and execution stage pages with numbered steps, project models, and a project page with its challenge', caption:'Each stage page explains the stage, then lists the steps. Project models show a real challenge and idea.' }] }
        ],
        note:'One question, “Which stage are you at?”, replaces a long table of contents.' },

      { id:'content', nav:'What’s inside', label:'What’s inside', title:'Role models, ideas and help', wide:true,
        text:['Around the journey, the home page gives quick access to registering a project, training and open data.'],
        blocks:[
          { type:'image', label:'Sono Women', src:`${SW}screens.webp`, alt:'Fourteen Sono Women screens on a marble background' },
          { type:'caps', items:[
            ['Inspiring entrepreneurs','Short profiles of women from Aswan who built projects, with a button to read each story.'],
            ['Project models','Ideas like drying, handicrafts and sustainable fashion, each with its challenge and description.'],
            ['Guidance','General guidance, or guidance to speed up women’s projects.']] }
        ] },

      { id:'art', nav:'Illustrations', label:'Art direction', title:'One warm style, made with AI', wide:true,
        text:['I generated the illustrations with AI tools and kept them to one style: women from the region, in warm terracotta and purple, so every stage page feels like part of the same story.'],
        blocks:[
          { type:'image', label:'Launch visual', src:`${SW}hero.webp`, alt:'Sono Women launch visual: the home screen on a phone next to “Start your journey in entrepreneurship”' }
        ] },

      { id:'learn', nav:'What I learned', label:'Looking back', title:'What I learned',
        blocks:[
          { type:'learn', items:[
            'Splitting a big goal into stages makes it feel possible.',
            'With AI images, a consistent style matters more than any single picture.',
            'Real women from Aswan made the goal feel close to home.'] }
        ] }
    ] },

  { slug:'aqeelah', title:'From a wall of banners to a real store',
    sections:[
      { id:'overview', nav:'Overview', title:'From a wall of banners to a real store',
        lede:'A design task for a job application: redesign the home page of Al-Aqeelah Al-Wataniya, an online grocery store in Kuwait.',
        blocks:[
          { type:'facts', items:[['Role','UI/UX designer · design task'],['Year','2025'],['Platform','Website · Arabic, right to left'],['Scope','Home page redesign']] },
          { type:'image', label:'The redesigned home page', src:`${AQ}cover-mockup.webp`, alt:'The redesigned Al-Aqeelah home page: search, categories, a delivery hero and product offers' }
        ],
        note:'A design task for a job application, based on the store’s live site at the time. It is not the shipped site.' },

      { id:'before', nav:'The old site', label:'The old site', title:'Big banners, little shopping',
        text:['The old home page was built from big promotional banners: phone numbers, one product per slide, and a map to the store. Categories sat far down the page, and the offers section was a single badge.'],
        blocks:[
          { type:'pair', title:'Home page, first screen', was:'the old site', now:'my redesign', before:`${AQ}before-top.webp`, after:`${AQ}after-top.webp`,
            facts:[
              ['One product per banner', 'Every category up front', 'Shoppers see the whole range before they scroll.'],
              ['A single “Offers” badge', 'Offers with real prices', 'Each deal shows the product, the discount and the price.'],
              ['Phone numbers as the main action', 'Order online', 'The hero leads to ordering, with search and the cart always in the header.']] }
        ],
        note:'The old page sold the company. The new one sells groceries.' },

      { id:'design', nav:'The redesign', label:'The redesign', title:'A home page you can shop from', wide:true,
        text:['I kept the brand’s red, white and green, and rebuilt the page around how people buy groceries: search first, then categories, offers and best sellers, with a banner for the app’s online discount.'],
        blocks:[
          { type:'caps', items:[
            ['Search and categories','A big search bar and every category in the header, one click away.'],
            ['Offers to compare','Deal cards with the product, the discount and the price.'],
            ['Best sellers','Product cards with a rating, the old and new price, and add to cart.'],
            ['Shop by budget','Notes like “under 5 dinars” for shoppers watching what they spend.']] },
          { type:'gallery', cols:2, items:[
            { label:'Before · the whole home page', src:`${AQ}before-full.webp`, alt:'The old home page from top to bottom: product banners, phone numbers, round category icons and a location map' },
            { label:'After · the whole home page', src:`${AQ}after-full.webp`, alt:'The redesigned home page from top to bottom: hero, categories, offers, best sellers, shop by budget, app banner and footer' }] }
        ] },

      { id:'system', nav:'Style guide', label:'Style guide', title:'A small system behind it',
        text:['Almarai in four weights for every heading and label, and a few reusable pieces: offer cards, product cards, and a slider with its arrows and dots.'],
        blocks:[
          { type:'image', label:'Typography and components', src:`${AQ}style.webp`, alt:'Almarai in extra bold, bold, regular and light, then an offer card, a product card, slider arrows and dots' }
        ] },

      { id:'learn', nav:'What I learned', label:'Looking back', title:'What I learned',
        blocks:[
          { type:'learn', items:[
            'A design task shows how you think. I started from what shoppers come to do, not from the old layout.',
            'For a grocery store, real products and real prices sell better than slogans.',
            'Keeping the brand’s colours made the change feel like an upgrade, not a new company.'] }
        ] }
    ] },

  { slug:'comave', title:'Six digits, every state designed',
    sections:[
      { id:'overview', nav:'Overview', title:'Six digits, every state designed',
        lede:'Login and phone verification for the ComAve app, a Luxembourg platform for shopping, travel booking and games.',
        blocks:[
          { type:'facts', items:[['Role','UI/UX designer · COMAVE'],['Year','2024'],['Platform','Mobile app'],['Scope','Login and OTP verification']] },
          { type:'image', label:'ComAve login', src:`${CA}cover-mockup.webp`, alt:'Three ComAve screens: login with email or phone, the six-digit code being filled in, and “Phone number verified”' }
        ],
        note:'Designed during my time at COMAVE. The original posts are on my Behance.' },

      { id:'otp', nav:'Verification', label:'Phone verification', title:'Every state of a six-digit code', wide:true,
        text:['Logging in with a one-time code looks simple, but the code can be slow, wrong or expired. I designed each of those moments so people always know what to do next.'],
        blocks:[
          { type:'spotlight', label:'Where it starts', title:'Email or phone, one screen', src:`${CA}s-login-email.webp`, alt:'Login screen with email and phone tabs, a Send OTP button, browse as a guest, and social sign-in',
            items:['Email and phone number as two tabs, not two separate flows.',
                   '“Send OTP” as the main action, with “Browse as a guest” right under it.',
                   'Apple, Google and Facebook sign-in for people who don’t want another password.'] },
          { type:'screens', title:'The verification flow', items:[
            { src:`${CA}s-login-phone.webp`, title:'Phone number', text:'Country code and number, then Send OTP.' },
            { src:`${CA}s-code-empty.webp`, title:'Waiting for the code', text:'Six boxes, a 2-minute timer and a Resend link.' },
            { src:`${CA}s-code-typed.webp`, title:'Code filled in', text:'The code from the SMS appears above the keyboard, ready to tap.' },
            { src:`${CA}s-code-invalid.webp`, tag:'Edge case', title:'Wrong code', text:'The boxes turn red with a clear message, and Resend is one tap away.' },
            { src:`${CA}s-code-sent.webp`, tag:'Edge case', title:'Code resent', text:'A green “OTP sent” confirms a new code is on its way.' },
            { src:`${CA}s-verified.webp`, title:'Verified', text:'A short success screen, then the app opens.' }] },
          { type:'image', label:'The prototype in Figma', src:`${CA}prototype.webp`, alt:'Figma prototype: 14 login and register screens linked by interaction arrows' }
        ] },

      { id:'learn', nav:'What I learned', label:'Looking back', title:'What I learned',
        blocks:[
          { type:'learn', items:[
            'An OTP flow is mostly edge cases. Designing the timer, the wrong code and the resend is what makes it feel calm.',
            'Offering email or phone on one screen, plus a guest option, keeps people from leaving at the first step.'] }
        ] }
    ] },

  { slug:'comave-pages', title:'The pages around sign-in',
    sections:[
      { id:'overview', nav:'Overview', title:'The pages around sign-in',
        lede:'Sign-up, newsletter, FAQ, privacy and contact pages for ComAve, a Luxembourg platform for shopping, travel booking and games, on the website and in the app.',

        note:'Designed during my time at COMAVE. The original post is on my Behance.' },

      { id:'pages', nav:'The pages', label:'The pages', title:'Small pages, still designed with care', wide:true,

        blocks:[
          { type:'gallery', cols:2, items:[
            { label:'Sign-up · step 1, contact details', src:`${CA}w-signup-1.webp`, alt:'Sign-up step 1 of 4: first name, last name and email, next to the ComAve brand panel' },
            { label:'Sign-up · step 2, secure your account', src:`${CA}w-signup-2.webp`, alt:'Sign-up step 2 of 4: create and confirm a password' },
