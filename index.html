<style>
:root{
  --panel:#FFFFFF; --canvas:#F4F4F4; --dot:#D6D6D6; --ink:#1E1E1E; --muted:#8A8A8A; --line:#E6E6E6;
  --hover:#F0F0F0; --field:#F5F5F5; --sel:#0D99FF; --shadow:0 10px 32px rgba(0,0,0,.14); --edge:rgba(0,0,0,.08);
  --pine:#1A2A28; --mint:#CEE8E3; --blush:#F7D1CD; --sand:#E9DCCE; --clay:#B06E4A; --noha:#B06E4A;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#2C2C2C; --canvas:#1E1E1E; --dot:#3A3A3A; --ink:#F2F2F2; --muted:#9A9A9A;
    --line:#3B3B3B; --hover:#383838; --field:#383838; --shadow:0 10px 32px rgba(0,0,0,.5); --edge:rgba(255,255,255,.08); color-scheme:dark; }
}
:root[data-theme="dark"]{ --panel:#2C2C2C; --canvas:#1E1E1E; --dot:#3A3A3A; --ink:#F2F2F2; --muted:#9A9A9A;
  --line:#3B3B3B; --hover:#383838; --field:#383838; --shadow:0 10px 32px rgba(0,0,0,.5); --edge:rgba(255,255,255,.08); color-scheme:dark; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--panel);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:12px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}

.toolbar{height:48px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);z-index:20}
.tb{white-space:nowrap;height:32px;min-width:32px;border:0;border-radius:6px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;cursor:pointer}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--sel);color:#fff}
.logo{width:32px;height:32px;border-radius:8px;background:var(--pine);color:var(--mint);font-weight:700;font-size:15px;display:grid;place-items:center;margin-right:4px}
.title{flex:1;text-align:center;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .dim{color:var(--muted)}
.avs{display:flex;margin:0 8px}
.av{width:28px;height:28px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;box-shadow:0 0 0 2px var(--panel)}
.av + .av{margin-left:-6px}
.ghost{border:1px solid var(--line)}
.blue{background:var(--sel);color:#fff;font-weight:600;padding:0 14px}
.blue:hover{background:#0B87E0}

.canvas{flex:1;position:relative;overflow:hidden;background-color:var(--canvas);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:22px 22px;touch-action:none;
  -webkit-user-select:none;user-select:none}   /* a design canvas: dragging moves cards instead of selecting text */
.canvas input,.canvas textarea{-webkit-user-select:text;user-select:text}
/* phone layout: one column, sized to the screen width, scrolls vertically */
.canvas.scroll{overflow-x:hidden;overflow-y:auto;touch-action:pan-y;background-attachment:local;overscroll-behavior:contain}
.world.tall #t1{font-size:40px}
.world.tall #t2{font-size:20px}
.canvas.mouse,.canvas.mouse *{cursor:none!important}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.ov{position:absolute;inset:0;pointer-events:none;z-index:10}

/* objects (world px) */
.obj{position:absolute;transition:box-shadow .2s}
.obj.grab:not(.card){box-shadow:0 22px 40px rgba(0,0,0,.18)}
.tbox{position:absolute;color:var(--ink);white-space:pre-wrap}
.tbox.editing{outline:2px solid var(--noha);outline-offset:6px}
.tbox.editing::after{content:"";display:inline-block;width:3px;height:.9em;background:var(--noha);vertical-align:-.08em;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.wave{display:inline-block;height:.92em;width:auto;margin-left:.18em;vertical-align:-.1em;transform-origin:72% 88%}
.wave.hi{animation:wave 1.8s ease-in-out .15s both}
@keyframes wave{0%{transform:scale(.3) rotate(-30deg);opacity:0}12%{transform:scale(1) rotate(0);opacity:1}
  24%{transform:rotate(16deg)}36%{transform:rotate(-8deg)}48%{transform:rotate(16deg)}60%{transform:rotate(-4deg)}72%,100%{transform:rotate(0)}}
#t1{font-size:72px;font-weight:700;letter-spacing:-.03em;line-height:1}
#t2{font-size:28px;line-height:1.45;color:var(--muted)}
/* ---- project cards (world px, about 1.3× the design's screen px) ---- */
.card{width:340px;display:flex;flex-direction:column;color:var(--ink);outline:none}
.card .lbl{font-size:15.5px;color:var(--muted);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s,opacity .3s}
.card.piled .lbl{opacity:0}   /* in the opening pile the labels would pile up too; each shows as its card lands */
.cbody{flex:1;display:flex;flex-direction:column;position:relative;border-radius:10px;border:1.3px solid var(--edge);background:#fff;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.cbody::after{content:"";position:absolute;inset:-1.3px;border-radius:10px;border:2.6px solid var(--sel);opacity:0;transition:opacity .2s;pointer-events:none}
.hd{position:absolute;width:10px;height:10px;background:#fff;border:2px solid var(--sel);opacity:0;transition:opacity .2s;z-index:2;pointer-events:none}
.hd.h1{left:-5px;top:-5px}.hd.h2{right:-5px;top:-5px}.hd.h3{left:-5px;bottom:-5px}.hd.h4{right:-5px;bottom:-5px}
.card.sel .cbody{transform:translateY(-5px)}
.card.sel .cbody,.card.grab .cbody{box-shadow:0 21px 44px rgba(0,0,0,.32)}
.card.sel .cbody::after,.card.sel .hd,.card.grab .cbody::after,.card.grab .hd{opacity:1}
.card.sel .lbl,.card.grab .lbl{color:var(--sel)}
.thumb{aspect-ratio:4/3;position:relative;overflow:hidden;border-radius:9px 9px 0 0;container-type:inline-size}
.thumb img,.litem .sw2 img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;pointer-events:none;-webkit-user-drag:none}
.cinfo{flex:1;display:flex;align-items:center;justify-content:space-between;gap:13px;padding:18px 18px 20px 21px;color:var(--pine)}
.cinfo h3{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.cinfo p{margin:4px 0 0;font-size:17px;color:#6B7573;line-height:1.35}
.cinfo p b{color:var(--pine);font-weight:600}
.carr{width:36px;height:36px;border-radius:50%;border:1.3px solid #C9CFCD;display:grid;place-items:center;flex:none;color:var(--pine);transition:background .2s,color .2s,border-color .2s}
.card.sel .carr{background:var(--pine);border-color:var(--pine);color:#fff}

/* thumbnails, scaled to the card width (cqw = 1% of the thumbnail width) */
.ph{position:absolute;left:50%;bottom:-10cqw;transform:translateX(-50%);width:42cqw;height:74cqw;background:#fff;border:2.4cqw solid var(--pine);border-radius:8cqw;padding:10cqw 4.5cqw 4cqw;display:flex;flex-direction:column;gap:3.2cqw}
.ph::before{content:"";position:absolute;top:3.2cqw;left:50%;width:30%;height:2cqw;border-radius:2cqw;background:var(--pine);transform:translateX(-50%)}
.ph i{display:block;height:2.6cqw;border-radius:2cqw;background:#E8E4DD}
.ph i.b{height:12cqw;border-radius:3cqw;background:var(--mint)}
.ph i.s{width:60%}
.ph i.c{background:var(--clay);width:40%}
.ph u{display:block;height:7cqw;border-radius:4cqw;background:var(--pine);margin-top:auto}
.ph .ring{width:24cqw;height:24cqw;border-radius:50%;margin:1cqw auto 2cqw;background:conic-gradient(var(--clay) 0 68%,#EFE9E0 0);display:grid;place-items:center}
.ph .ring::after{content:"";width:17cqw;height:17cqw;border-radius:50%;background:#fff}
.ds{position:absolute;inset:14cqw 10cqw 16cqw;background:#fff;border-radius:4cqw;padding:6cqw;display:grid;gap:5cqw;align-content:start;box-shadow:0 4cqw 8cqw rgba(26,42,40,.1)}
.ds .r{display:flex;gap:3cqw;align-items:center}
.ds .dot{width:7cqw;height:7cqw;border-radius:50%}
.ds .pill{height:7cqw;border-radius:4cqw;flex:1}
.ds .pill.p{background:var(--pine)}.ds .pill.o{border:1cqw solid var(--pine)}
.ds .bar{height:7cqw;border-radius:2cqw;border:.8cqw solid #D9D4CB}

/* ---- experience timeline ---- */
.exp{background:var(--sand);color:var(--pine);border-radius:10px;padding:42px}
/* "See all N projects" under the four cards: the way into the full list */
.morew{display:inline-flex;align-items:center;gap:12px;height:62px;padding:0 30px;border-radius:31px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font-family:inherit;font-size:22px;font-weight:600;line-height:1;cursor:pointer;white-space:nowrap;box-shadow:0 6px 18px -10px rgba(0,0,0,.25);transition:border-color .2s,color .2s,transform .2s}
.morew:hover,.morew:focus-visible{border-color:var(--sel);color:var(--sel);transform:translateY(-1px);outline:none}
.morew.in{animation:morein .4s ease-out}
@keyframes morein{from{opacity:0;transform:translateY(6px)}}
.exp-h{display:flex;align-items:baseline;justify-content:space-between;gap:21px;margin-bottom:34px}
.exp-h h3{margin:0;font-size:29px;letter-spacing:-.015em}
.exp-h span{font-size:17.5px;color:#6B7573}
.tl{position:relative;display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:36px 42px}
.tl::before{content:"";position:absolute;left:0;right:0;top:8px;height:2.6px;background:rgba(176,110,74,.35);border-radius:2px}
.world.tall .tl::before{display:none}
.job{position:relative;padding-top:34px}
.job::before{content:"";position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:var(--sand);border:3.2px solid var(--clay);box-sizing:border-box}
.job.now{background:rgba(255,255,255,.38);border-radius:8px;margin:-16px -18px;padding:49px 18px 18px}
.job.now::before{left:18px;top:16px;background:var(--clay);box-shadow:0 0 0 6.5px rgba(176,110,74,.18)}
.date{display:flex;align-items:center;gap:10px;font-size:16px;color:#7A6A5C;margin-bottom:10px;font-variant-numeric:tabular-nums}
.pillnow{font-size:14px;font-weight:600;padding:3px 10px;border-radius:13px;background:var(--clay);color:#fff}
.job h4{margin:0;font-size:19.5px;line-height:1.3}
.co{font-size:17px;font-weight:600;margin-top:4px}
.co span{font-weight:400;color:#6B7573}
.job p{margin:13px 0 0;font-size:17.5px;line-height:1.55;color:#3C4A48}

/* ---- about + contact ---- */
.box{border-radius:10px;padding:31px}
.box .inner{display:flex;flex-direction:column;height:100%}
.about{background:var(--mint);color:var(--pine)}
.ab-h{display:flex;align-items:center;gap:16px;margin-bottom:21px}
.ab-h img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2.6px solid #fff;flex:none;pointer-events:none}
.ab-h h3{margin:0;font-size:26px;letter-spacing:-.01em}
.tabs{display:grid;gap:3px;padding:4px;border-radius:24px;background:rgba(26,42,40,.08)}
.tabs button{height:39px;padding:0 6px;white-space:nowrap;border:0;border-radius:20px;background:transparent;color:#4F5F5C;font-size:16px;font-weight:500;cursor:pointer;transition:background .2s,color .2s}
.tabs button:hover{color:var(--pine)}
.tabs button[aria-selected="true"]{background:#fff;color:var(--pine);font-weight:600;box-shadow:0 1px 4px rgba(26,42,40,.12)}
.tabpanel{margin-top:21px;font-size:18px;line-height:1.6;color:#3C4A48}
.tabpanel p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{padding:6px 14px;border-radius:18px;background:rgba(255,255,255,.65);font-size:17px;color:var(--pine)}
.tabpanel dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 18px}
.tabpanel dt{color:#6B7573;font-variant-numeric:tabular-nums}.tabpanel dd{margin:0;color:var(--pine)}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.contact{background:var(--pine);color:#fff}
.contact h3{margin:0;font-size:34px;letter-spacing:-.02em}
.avail{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:18px;color:#BFD6D1}
.avail i{width:10px;height:10px;border-radius:50%;background:#14AE5C;box-shadow:0 0 0 5px rgba(20,174,92,.2);flex:none}
.ctas{margin-top:auto;padding-top:29px;display:grid;grid-template-columns:minmax(0,1fr);gap:13px}
.contact{container-type:inline-size}
.email{height:57px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:13px;padding:0 8px 0 21px;border:0;border-radius:29px;background:var(--mint);color:var(--pine);font-size:19px;font-weight:600;cursor:pointer}
.email .addr{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.email .cp{height:42px;padding:0 18px;border-radius:21px;background:var(--pine);color:#fff;font-size:16px;display:grid;place-items:center;flex:none;min-width:99px;transition:background .2s}
.email.done .cp{background:#14AE5C}
.ghosts{display:flex;flex-wrap:wrap;gap:10px}
.gh{height:57px;flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;border-radius:29px;border:1.3px solid rgba(255,255,255,.25);color:#fff;text-decoration:none;font-size:17.5px;font-weight:500;white-space:nowrap;transition:background .2s,border-color .2s}
.gh:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.5)}
/* the narrow (phone) contact card: a tighter email row so the address and Copy both fit */
@container (max-width: 420px){
  .email{font-size:17px;padding-left:16px;gap:10px}
  .email .cp{min-width:0;padding:0 15px}
}

.drawn{overflow:hidden}
.drawn .inner{opacity:0;transition:opacity .35s}
.drawn.done .inner{opacity:1}
.drawn.drawing{outline:2px solid var(--noha)}

/* ---- sticky note ---- */
.sticky{background:#FFF1B8;color:#4A4128;padding:23px 47px 23px 23px;font-size:18px;line-height:1.55;box-shadow:0 16px 31px rgba(0,0,0,.28);border-radius:3px}
.sticky b{display:block;font-size:19.5px;margin-bottom:5px}
.sticky kbd{font:inherit;font-weight:600;font-size:16px;background:rgba(0,0,0,.08);padding:0 8px;border-radius:5px}
.sticky .x{position:absolute;right:8px;top:8px;width:34px;height:34px;border:0;border-radius:8px;background:none;color:#4A4128;cursor:pointer;display:grid;place-items:center}
.sticky .x:hover{background:rgba(0,0,0,.08)}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4) rotate(var(--r,0deg));opacity:0}to{transform:scale(1) rotate(var(--r,0deg));opacity:1}}
.hide{display:none!important}

/* cursors + chat (screen px) */
.cur{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.cur svg{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.cur .tag{position:absolute;left:16px;top:18px;padding:3px 8px;border-radius:4px 10px 10px 10px;color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.cur .chat{position:absolute;left:16px;top:18px;padding:8px 12px;border-radius:4px 16px 16px 16px;color:#fff;font-size:13.5px;line-height:1.35;max-width:240px;width:max-content;opacity:0;transform:translateY(4px);transition:.25s}
.cur .chat.show{opacity:1;transform:none}
.cur.flip .chat{left:auto;right:4px;border-radius:16px 4px 16px 16px}   /* near the right edge the bubble opens to the left */
.cur.chatting .tag{opacity:0}
.cur.click svg{animation:clk .25s}
@keyframes clk{50%{transform:scale(.8)}}
#me .cmt{display:none}
#me.commenting .arrow{display:none}
#me.commenting .cmt{display:block}
.mechat{position:absolute;left:16px;top:18px;padding:6px 8px;border-radius:4px 16px 16px 16px;display:none;pointer-events:auto}
.mechat.show{display:block}
.mechat input{width:220px;border:0;background:transparent;color:#fff;outline:none;font-size:13.5px}
.mechat input::placeholder{color:rgba(255,255,255,.75)}
.pin{position:absolute;pointer-events:auto;cursor:pointer;transform:translate(0,-100%)}
.pin .dot{width:30px;height:30px;border-radius:50% 50% 50% 0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.25);border:2px solid #fff}
.pin .bub{position:absolute;left:38px;top:0;width:240px;background:var(--panel);color:var(--ink);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;display:none}
.pin.open .bub{display:block}
.pin.left .bub{left:auto;right:38px}   /* near the right edge the bubble opens to the left */
.pin .bub b{display:block;font-size:12.5px;margin-bottom:4px}
.pin .bub span{font-size:13.5px;line-height:1.45}

.tidy:hover{background:var(--sel);color:#fff}
.touchbar{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:none;gap:8px;z-index:11}

.tchat button.x{border-radius:50%;width:32px;background:rgba(255,255,255,.2);color:#fff}

/* ---------------- layouts (world units) ---------------- */
// Fixed: x positions and widths. Computed by flow() from the content: every y, height and the canvas height H.
const LAYOUTS = {

  tall:{ W:440, scroll:true, stack:true, t1:[20,50,400], t2:[22,190,400], top:392, gap:34, pad:90, cols:1,
         cardW:400, cardX:[20,20,20,20], expCol:[20,400],
         rowCols:{ about:[20,400], contact:[20,400], sticky:[60,320,-2] }, pin:[330,40] }
};
let L = LAYOUTS.wide, S = { x:0, y:0, s:1 };
const canvas = $('#canvas'), world = $('#world'), ov = $('#ov');
function pickLayout(){ return canvas.clientWidth / canvas.clientHeight < 0.95 ? LAYOUTS.tall : LAYOUTS.wide; }
function fit(){
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  const s = L.scroll ? Math.min(cw / L.W, 1.4) : Math.min(cw / L.W, ch / L.H) * 0.95;

}
const w2s = (x, y) => ({ x:S.x + x * S.s, y:S.y + y * S.s });
const s2w = (x, y) => ({ x:(x - S.x) / S.s, y:(y - S.y) / S.s });

/* ---------------- objects ---------------- */
const cards = PROJECTS.slice(0, 4).map((p, i) => {
  const el = document.createElement('div');
  el.className = 'obj card'; el.dataset.card = i; el.tabIndex = 0;
  el.setAttribute('role', 'link'); el.setAttribute('aria-label', `${p.title}, open case study`);
  el.innerHTML = `<div class="lbl">${esc(p.kicker)}</div>
    <div class="cbody"><i class="hd h1"></i><i class="hd h2"></i><i class="hd h3"></i><i class="hd h4"></i>

      <div class="cinfo"><div><h3>${esc(p.title)}</h3>${p.out ? `<p><b>${esc(p.out[0])}</b> ${esc(p.out[1])}</p>` : ''}</div>
        <span class="carr" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></div>
    </div>`;
  world.appendChild(el);
  const c = { el, x:0, y:0, r:0 };
  // hover / keyboard focus = "selected" in the design file; Noha's cursor comes over to look too
  el.addEventListener('pointerenter', e => {

  el.addEventListener('pointerleave', () => el.classList.remove('sel'));

  el.addEventListener('blur', () => el.classList.remove('sel'));
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openCase(i); } });
  return c;
});
const about = { el:$('#about') }, contact = { el:$('#contact') }, sticky = { el:$('#sticky') }, exp = { el:$('#exp') };
exp.el.querySelector('.inner').innerHTML = `<div class="exp-h"><h3>Experience</h3>${C.experienceSummary ? `<span>${esc(C.experienceSummary)}</span>` : ''}</div>
  <div class="tl">${(C.experience || []).map(r => { const [co, ...loc] = r.org.split(' · ');
    return `<div class="job${r.now ? ' now' : ''}"><div class="date">${esc(r.when)}${r.now ? ' <span class="pillnow">Current</span>' : ''}</div>
      <h4>${esc(r.role)}</h4><div class="co">${esc(co)}${loc.length ? ` <span>· ${esc(loc.join(' · '))}</span>` : ''}</div><p>${esc(r.text)}</p>${r.now && NDA_AT === 'experience' ? `<button type="button" class="ndatag" data-nda-open>${LOCK_SVG}Work under NDA<span aria-hidden="true">→</span></button>` : ''}</div>`; }).join('')}</div>`;
function pos(o){ o.el.style.left = o.x + 'px'; o.el.style.top = o.y + 'px'; o.el.style.transform = o.r ? `rotate(${o.r}deg)` : ''; }

}

  tab = (tab + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length; renderAbout(true); $(`#tabs [data-t="${tab}"]`).focus();
});
const X_KEY = 'ng-sticky-x';
let stickyGone = false; try { stickyGone = !!localStorage.getItem(X_KEY); } catch {}
sticky.el.innerHTML = (coarse
  ? '<b>psst 👀</b>This page is a live design file.<br>Tap a card to open it, or use Comment and Chat below.'
  : '<b>psst 👀</b>This page is a live design file.<br>Drag the cards around<br>Press <kbd>C</kbd> to comment<br>Press <kbd>/</kbd> to chat with me')
  + '<button class="x" id="stickyX" aria-label="Dismiss note"><svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>';
$('#stickyX').addEventListener('click', () => { stickyGone = true; sticky.el.classList.add('hide'); try { localStorage.setItem(X_KEY, '1'); } catch {} });
renderAbout();

/* ---------------- flow: measure content, then place every row ---------------- */
function measure(el, w){                      // natural height in world px at width w
  const hid = el.classList.contains('hide'), s = el.style, prev = [s.width, s.height, s.visibility];
  el.classList.remove('hide'); Object.assign(s, { visibility:'hidden', width:w + 'px', height:'auto' });
  const h = el.offsetHeight;
  [s.width, s.height, s.visibility] = prev; if (hid) el.classList.add('hide');
  return Math.ceil(h);
}
function flow(){
  cards.forEach(c => Object.assign(c.el.style, { width:L.cardW + 'px', height:'' }));
  const ch = Math.max(...cards.map(c => c.el.offsetHeight));
  cards.forEach(c => c.el.style.height = ch + 'px');
  L.cardH = ch;
  const lineGap = NDA_AT === 'line' ? (L.stack ? 112 : 58) : 0;   // room for the NDA line above the cards
  let y = L.top + lineGap;
  L.slots = cards.map((c, i) => { const s = [L.cardX[i], y]; if (L.stack) y += ch + L.gap; return s; });
  if (!L.stack) y += ch + L.gap;
  // "See all N projects": right under the cards, right-aligned (full width when stacked)
  if (MORE_N > 4){
    const m = moreLink, was = m.classList.contains('hide'); m.classList.remove('hide');
    m.style.width = L.stack ? L.cardW + 'px' : ''; m.style.justifyContent = L.stack ? 'center' : '';
    const w = m.offsetWidth, mh = m.offsetHeight, top = y - L.gap + 18;
    if (was) m.classList.add('hide');
    L.more = [L.stack ? L.cardX[0] : L.cardX[3] + L.cardW - w, top]; y = top + mh + L.gap;
  }
  const [ex, ew] = L.expCol;
  L.exp = [ex, y, ew, measure(exp.el, ew)]; y += L.exp[3] + L.gap;
  // About keeps one height for every tab, so switching tabs never resizes it
  const cur = tab, rc = L.rowCols;
  let ah = 0; TABS.forEach((t, i) => { tab = i; renderAbout(); ah = Math.max(ah, measure(about.el, rc.about[1])); });
  tab = cur; renderAbout();
  const chh = measure(contact.el, rc.contact[1]);
  sticky.el.style.height = ''; const sh = measure(sticky.el, rc.sticky[1]);
  if (L.stack){
    L.about = [rc.about[0], y, rc.about[1], ah]; y += ah + L.gap;
    L.contact = [rc.contact[0], y, rc.contact[1], chh]; y += chh + L.gap;
    L.sticky = [rc.sticky[0], y, rc.sticky[1], sh, rc.sticky[2]]; y += sh + L.gap;
  } else {
    const rh = Math.max(ah, chh);
    L.about = [rc.about[0], y, rc.about[1], rh];
    L.contact = [rc.contact[0], y, rc.contact[1], rh];
    L.sticky = [rc.sticky[0], y, rc.sticky[1], sh, rc.sticky[2]];
    y += Math.max(rh, sh) + L.gap;
  }
  L.H = y - L.gap + L.pad;
  L.pile = L.stack ? [L.W / 2, 640] : [L.W - 340, L.H - 230];   // phones: centred, so no card hangs off the screen
}

/* ---------------- cursors ---------------- */
const noha = { x:0, y:0, el:$('#noha') };
function drawNoha(){ const p = w2s(noha.x, noha.y); noha.el.style.transform = `translate(${p.x}px,${p.y}px)`; }
const NAMES = ['Curious Recruiter 🦊','Friendly PM 🐼','Fellow Designer 🦉','Mystery Visitor 🐙','Kind Developer 🐢'];
const COLORS = ['#0D99FF','#14AE5C','#9747FF','#F24822','#FF8C00'];
const me = { name:NAMES[Math.floor(Math.random() * NAMES.length)], color:COLORS[Math.floor(Math.random() * COLORS.length)], x:-99, y:-99, el:$('#me') };
me.el.style.color = me.color;
me.el.querySelector('.tag').textContent = me.name; me.el.querySelector('.tag').style.background = me.color;
me.el.querySelector('.chat').style.background = me.color; me.el.querySelector('.mechat').style.background = me.color;
$('#avs').innerHTML = `<div class="av" style="background:var(--noha)" title="${esc(ME_NAME)}">${esc(ME_NAME[0])}</div><div class="av" style="background:${me.color}" title="${esc(me.name)} (you)">${me.name[0]}</div>`;

function chat(el, text, ms = 3800){
  const c = el.querySelector('.chat'); c.textContent = text; c.classList.add('show'); el.classList.add('chatting');
  // keep the bubble on screen: open it to the left when it would run past the right edge
  el.classList.remove('flip');
  if (c.getBoundingClientRect().right > canvas.getBoundingClientRect().right - 8) el.classList.add('flip');
  clearTimeout(c._t); c._t = setTimeout(() => { c.classList.remove('show'); el.classList.remove('chatting', 'flip'); }, ms);
}
function clickPulse(){ noha.el.classList.remove('click'); void noha.el.offsetWidth; noha.el.classList.add('click'); }

/* ---------------- motion engine ---------------- */
let run = 0, moveTok = 0;
const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
function wait(ms, alive){ return new Promise((res, rej) => setTimeout(() => alive() ? res() : rej('abort'), reduced ? Math.min(ms, 60) : ms)); }
function moveNoha(tx, ty, dur, alive, onStep){
  const tok = ++moveTok;
  return new Promise((res, rej) => {
    const sx = noha.x, sy = noha.y;
    const cx = (sx + tx) / 2 + (ty - sy) * 0.18, cy = (sy + ty) / 2 - (tx - sx) * 0.18;
    const t0 = performance.now(); if (reduced) dur = 1;
    const f = now => {
      if (!alive()) return rej('abort');
      if (tok !== moveTok) return res();
      const k = Math.min(1, (now - t0) / dur), e = ease(k), u = 1 - e;
      noha.x = u*u*sx + 2*u*e*cx + e*e*tx; noha.y = u*u*sy + 2*u*e*cy + e*e*ty;
      if (onStep) onStep(e); drawNoha();
      k < 1 ? requestAnimationFrame(f) : res();
    };
    requestAnimationFrame(f);
  });
}
async function type(el, text, speed, alive){
  el.textContent = '';
  for (const ch of Array.from(text)){ el.textContent += ch; await wait(speed + Math.random() * speed * 0.8, alive); }
}
async function drag(o, tx, ty, dur, alive){
  const ox = noha.x - o.x, oy = noha.y - o.y, r0 = o.r;
  o.el.classList.add('grab'); o.el.style.zIndex = ++zTop;
  await moveNoha(tx + ox, ty + oy, dur, alive, e => { o.x = noha.x - ox; o.y = noha.y - oy; o.r = r0 * (1 - e); pos(o); });
  o.x = tx; o.y = ty; o.r = 0; pos(o); o.el.classList.remove('grab');
}
async function drawBox(o, r, alive){
  const [x, y, w, h] = r;
  o.x = x; o.y = y; o.r = 0; pos(o);
  o.el.style.width = '0px'; o.el.style.height = '0px'; o.el.classList.remove('hide', 'done'); o.el.classList.add('drawing');
  await moveNoha(x, y, 450, alive); clickPulse();
  await moveNoha(x + w, y + h, 550, alive, e => { o.el.style.width = w * e + 'px'; o.el.style.height = h * e + 'px'; });
  o.el.style.width = w + 'px'; o.el.style.height = h + 'px';
  o.el.classList.remove('drawing'); o.el.classList.add('done');
}
let zTop = 5;

/* ---------------- states ---------------- */
function resetScene(){
  showTidy(false); $('#ndaLine').classList.add('hide');
  $('#t1').textContent = ''; $('#t2').textContent = '';
  [$('#t1'), $('#t2')].forEach(t => t.classList.remove('editing'));
  const [px, py] = L.pile;
  const sp = L.stack ? .35 : 1;   // phones: cards nearly fill the width, so a tighter, flatter pile
  cards.forEach((c, i) => { c.x = px - L.cardW / 2 + (i - 1.5) * 14 * sp; c.y = py - L.cardH / 2 + (i - 1.5) * 10; c.r = [-9, 6, -4, 8][i] * (L.stack ? .3 : 1); c.el.classList.add('piled'); c.el.style.zIndex = 2 + cards.length - i; pos(c); });   // first card on top: it is the first one Noha picks up
  [exp, about, contact].forEach(o => { o.el.classList.add('hide'); o.el.classList.remove('done', 'drawing'); });
  sticky.el.classList.add('hide'); moreLink.classList.add('hide');
  pins = pins.filter(p => !p.noha); placePins();
  noha.x = L.W + 80; noha.y = L.H * 0.45; drawNoha();
}
function finalScene(){
  showTidy(false); showNdaLine(false);
  $('#t1').textContent = T1; addWave(false); $('#t2').textContent = T2;
  [$('#t1'), $('#t2')].forEach(t => t.classList.remove('editing'));
  cards.forEach((c, i) => { c.x = L.slots[i][0]; c.y = L.slots[i][1]; c.r = 0; c.el.classList.remove('grab', 'piled'); pos(c); });
  [[exp, L.exp], [about, L.about], [contact, L.contact]].forEach(([o, r]) => {
    o.x = r[0]; o.y = r[1]; o.r = 0; pos(o); o.el.style.width = r[2] + 'px'; o.el.style.height = r[3] + 'px';
    o.el.classList.remove('hide', 'drawing'); o.el.classList.add('done');
  });
  placeSticky(false); addNohaPin(); placeMore(false);
}
function placeMore(animate){
  if (!L.more) return;
  Object.assign(moreLink.style, { left:L.more[0] + 'px', top:L.more[1] + 'px' });
  moreLink.classList.remove('hide', 'in'); if (animate){ void moreLink.offsetWidth; moreLink.classList.add('in'); }
}
// waving hand after the headline; falls back to the emoji if the image can't load
function addWave(animate){
  const t1 = $('#t1'), im = new Image();
  im.src = C.wave || 'assets/wave.png'; im.alt = '👋'; im.className = 'wave' + (animate ? ' hi' : '');
  im.onerror = () => im.replaceWith(' 👋');
  t1.querySelector('.wave')?.remove(); t1.append(im);
}
function placeText(){
  const [x1, y1, w1] = L.t1, [x2, y2, w2] = L.t2;
  Object.assign($('#t1').style, { left:x1 + 'px', top:y1 + 'px', width:w1 ? w1 + 'px' : '' });
  Object.assign($('#t2').style, { left:x2 + 'px', top:y2 + 'px', width:w2 + 'px' });
  exp.el.style.setProperty('--cols', L.cols);
  world.classList.toggle('tall', L === LAYOUTS.tall);
  canvas.classList.toggle('scroll', !!L.scroll);
  if (!L.scroll) canvas.scrollTop = 0;
}
function placeSticky(animate){
  if (stickyGone) return;
  const [x, y, w, h, r] = L.sticky;
  Object.assign(sticky, { x, y, r }); pos(sticky);
  Object.assign(sticky.el.style, { width:w + 'px', height:h + 'px' });
  sticky.el.style.setProperty('--r', r + 'deg');
  sticky.el.classList.remove('hide', 'pop'); if (animate){ void sticky.el.offsetWidth; sticky.el.classList.add('pop'); }
}

/* ---------------- intro ---------------- */
let introDone = false;
let miniT;
function setBusy(b){
  // full status while setting up; a few seconds after, it shrinks to just the green dot (hover to expand)
  clearTimeout(miniT); $('#status').classList.remove('mini');
  if (!b) miniT = setTimeout(() => $('#status').classList.add('mini'), 5000);
  $('#status').classList.toggle('busy', b);
  $('#status span').textContent = b ? `${ME_NAME} is setting things up…` : `${ME_NAME} is here, and so are you (${me.name})`;
  $('#skipBtn').textContent = b ? 'Skip intro' : 'Replay intro';
}
async function intro(){
  const id = ++run; const alive = () => id === run;
  introDone = false; setBusy(true); resetScene();
  try {
    await wait(350, alive);
    const [x1, y1] = L.t1, [x2, y2] = L.t2;
    await moveNoha(x1 + 20, y1 + 40, 700, alive); clickPulse();
    $('#t1').classList.add('editing'); await type($('#t1'), T1, 45, alive); $('#t1').classList.remove('editing'); addWave(true);
    await moveNoha(x2 + 10, y2 + 24, 400, alive); clickPulse();
    // the long subtitle is pasted in, not typed
    $('#t2').textContent = T2; $('#t2').animate([{ opacity:0, transform:'translateY(6px)' }, { opacity:1, transform:'none' }], { duration:reduced ? 0 : 350, easing:'ease-out' });
    showNdaLine(true);
    await wait(300, alive);
    for (let i = 0; i < cards.length; i++){
      const c = cards[i];
      await moveNoha(c.x + L.cardW / 2, c.y + 40, 380, alive); clickPulse();
      await drag(c, L.slots[i][0], L.slots[i][1], 520, alive); c.el.classList.remove('piled');
      if (i === 0) chat(noha.el, PROJECTS[0].nda ? 'my latest work, under NDA 🤫' : 'my favourite project 👇', 1600);
    }
    placeMore(true);
    await drawBox(exp, L.exp, alive);
    await drawBox(about, L.about, alive);
    await drawBox(contact, L.contact, alive);
    await moveNoha(L.sticky[0] + 60, L.sticky[1] + 40, 450, alive); clickPulse(); placeSticky(true);
    await wait(150, alive);
    await moveNoha(L.pin[0], L.pin[1], 500, alive); clickPulse(); addNohaPin(true);
    await wait(2200, alive);
    const np = pins.find(q => q.noha); if (np){ np.open = false; placePins(); }
    await moveNoha(L.W * 0.56, L.H * 0.36, 600, alive);
    chat(noha.el, coarse ? 'Your turn. Tap a card to open it 👋' : 'Your turn. Drag a card, or press / to say hi 👋', 4200);
  } catch (e){ if (e !== 'abort') console.error(e); return; }
  finishIntro(id);
}
const SEEN = 'ng-intro-seen';
function finishIntro(id){ introDone = true; setBusy(false); idle(id); try { sessionStorage.setItem(SEEN, '1'); } catch {} }
function skip(){ const id = ++run; finalScene(); moveNoha(L.W * 0.62, L.H * 0.3, 500, () => id === run).catch(() => {}); finishIntro(id); }
$('#skipBtn').onclick = () => introDone ? intro() : skip();

/* ---------------- light / dark toggle: starts from the system setting, the choice is remembered on every page ---------------- */
const SUN = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>';
const MOON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.5 9.6A5.7 5.7 0 0 1 6.4 2.5a5.7 5.7 0 1 0 7.1 7.1Z"/></svg>';
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function paintThemeBtn(){ const d = isDark(), b = $('#themeBtn'); b.innerHTML = d ? SUN : MOON; b.title = b.ariaLabel = d ? 'Switch to light theme' : 'Switch to dark theme'; }
$('#themeBtn').onclick = () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('ng-theme', t); } catch {} paintThemeBtn(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeBtn);
paintThemeBtn();

/* ---------------- idle life ---------------- */
const LINES = ['hmm, what should I design next 🤔','that grid looks tidy 👌','coffee break soon ☕','psst: every card opens into a case study'];
function idle(id){
  (async () => {
    const alive = () => id === run;
    while (alive()){
      try {
        await wait(3200 + Math.random() * 3800, alive);
        if (dragging || chatOpen) continue;
        let tx, ty;
        if (me.x > 0 && Math.random() < 0.4){ const w = s2w(me.x, me.y); tx = w.x + 70; ty = w.y + 50; }
        else { const c = cards[Math.floor(Math.random() * cards.length)]; tx = c.x + 40 + Math.random() * 260; ty = c.y + 30 + Math.random() * 180; }
        await moveNoha(Math.min(L.W - 40, Math.max(20, tx)), Math.min(L.H - 40, Math.max(20, ty)), 1300 + Math.random() * 900, alive);
        if (Math.random() < 0.22) chat(noha.el, LINES[Math.floor(Math.random() * LINES.length)], 3000);
      } catch { break; }
    }
  })();
}

/* ---------------- comments (stored only in the visitor's browser) ---------------- */
const KEY = 'ng-portfolio-comments';
// comments live only on the open page: a refresh starts clean (older versions kept them in localStorage)
let pins = [];
try { localStorage.removeItem(KEY); } catch {}
function placePins(){
  ov.querySelectorAll('.pin').forEach(n => n.remove());
  pins.forEach(p => {
    const s = w2s(p.x, p.y), n = document.createElement('div'), view = viewBox(), bw = Math.min(240, view.w - 70);
    n.className = 'pin' + (p.open ? ' open' : '') + (s.x + 38 + bw > view.r ? ' left' : '');
    n.style.left = s.x + 'px'; n.style.top = s.y + 'px';
    n.innerHTML = `<div class="dot" style="background:${p.color}">${esc(p.name[0])}</div><div class="bub" style="width:${bw}px"><b>${esc(p.name)}</b><span>${esc(p.text)}</span></div>`;
    n.addEventListener('pointerdown', e => e.stopPropagation());
    n.addEventListener('click', () => { p.open = !p.open; placePins(); });
    ov.appendChild(n);
  });
}
function addNohaPin(open){
  if (pins.some(p => p.noha)) return;
  pins.unshift({ noha:true, x:L.pin[0], y:L.pin[1], name:ME_NAME, color:'#B06E4A', text:'Welcome! This whole page is a design file. Move things around, nothing will break 🙂', open:!!open });
  placePins();
}
let mode = 'move', composer = null;
// the visible part of the canvas, in canvas-content pixels: overlays stay inside it so nothing scrolls the page sideways
function viewBox(){ const l = canvas.scrollLeft, w = canvas.clientWidth; return { l:l + 8, r:l + w - 8, w }; }
function setMode(m){
  mode = m;
  $('#tMove').classList.toggle('on', m === 'move'); $('#tComment').classList.toggle('on', m === 'comment');
  $('#tbComment').classList.toggle('on', m === 'comment'); $('#tbComment').textContent = m === 'comment' ? 'Cancel' : 'Comment';
  me.el.classList.toggle('commenting', m === 'comment');
  if (m !== 'comment') closeComposer();
}
function openComposer(wx, wy){
  closeComposer();
  const s = w2s(wx, wy), view = viewBox(), w = Math.min(280, view.w - 16);
  // to the right of the tap, or to its left when there's no room, and never past either edge
  let x = s.x + 38; if (x + w > view.r) x = s.x - w - 8; x = Math.max(view.l, Math.min(x, view.r - w));
  composer = document.createElement('div'); composer.className = 'composer';
  Object.assign(composer.style, { left:x + 'px', top:Math.max(s.y, canvas.scrollTop + 60) + 'px', width:w + 'px' });
  composer.innerHTML = '<input maxlength="140" placeholder="Leave a comment…" aria-label="Comment" enterkeyhint="send"><button class="post">Post</button><button class="x" aria-label="Cancel comment">×</button>';
  composer.addEventListener('pointerdown', e => e.stopPropagation());
  composer.querySelector('.x').onclick = () => { closeComposer(); setMode('move'); };
  ov.appendChild(composer);
  const inp = composer.querySelector('input'); inp.focus({ preventScroll:true }); requestAnimationFrame(() => inp.isConnected && inp.focus({ preventScroll:true }));
  const post = () => {
    const t = inp.value.trim(); if (!t) return closeComposer();
    pins.push({ x:wx, y:wy, name:me.name, color:me.color, text:t, open:true }); deliver('comment', t); closeComposer(); placePins();
    if (introDone) setTimeout(() => chat(noha.el, 'Thanks for the note! 💬', 3200), 900);
    setMode('move');
  };
  composer.querySelector('.post').onclick = post;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') post(); if (e.key === 'Escape') closeComposer(); e.stopPropagation(); });
}
function closeComposer(){ if (composer){ composer.remove(); composer = null; } }

/* ---------------- inbox: comments and chat messages emailed to Noha, quietly (only when C.inbox is set) ---------------- */
let sent = 0;
function deliver(kind, text){
  if (!C.inbox || ++sent > 12) return;   // a small cap per page load against spam
  fetch('https://api.web3forms.com/submit', { method:'POST', headers:{ 'Content-Type':'application/json', Accept:'application/json' },
    body:JSON.stringify({ access_key:C.inbox, subject:`Portfolio ${kind} from ${me.name}`, from_name:'Portfolio', message:text, visitor:me.name, page:location.href }) }).catch(() => {});
}

/* ---------------- cursor chat ---------------- */
let chatOpen = false;
function reply(t){
  const s = t.toLowerCase();
  if (/hire|job|work|role|position|freelance|project/.test(s)) return 'Yes! The contact card has my email 📬';
  if (/hi|hello|hey|salam|ahlan|مرحب|اهلا/.test(s)) return 'Hey! 👋 Thanks for dropping by';
  if (/love|nice|cool|great|amazing|wow/.test(s)) return 'That made my day, thank you ✨';
  return 'Ha, love that. Thanks for saying hi ✨';
}
function sendChat(text){
  chat(me.el, text, 3600); deliver('chat message', text);
  const id = run;
  setTimeout(async () => {
    if (introDone && me.x > 0){ const w = s2w(me.x, me.y); try { await moveNoha(w.x + 80, w.y + 60, 700, () => id === run); } catch {} }
    chat(noha.el, reply(text), 4000);
  }, 900);
}
// phones and narrow windows use the chat bar at the bottom; the cursor bubble needs room beside the cursor
const barChat = () => coarse || canvas.clientWidth < 600;
function openMeChat(){
  if (barChat()){ $('#tchat').classList.add('show'); $('#tInput').focus({ preventScroll:true }); chatOpen = true; $('#tbChat').classList.add('on'); return; }
  if (me.x < 0){   // opened from the toolbar: the cursor is off the canvas, so show the bubble in the middle of the view
    me.x = canvas.scrollLeft + canvas.clientWidth * 0.42; me.y = canvas.scrollTop + canvas.clientHeight * 0.4;
    me.el.style.transform = `translate(${me.x}px,${me.y}px)`;
  }
  me.el.hidden = false;
  chatOpen = true; me.el.classList.add('chatting'); const box = me.el.querySelector('.mechat'); box.classList.add('show');
  const inp = $('#meInput'); inp.value = ''; setTimeout(() => inp.focus(), 0);
}
function closeMeChat(){ chatOpen = false; me.el.querySelector('.mechat').classList.remove('show'); me.el.classList.remove('chatting'); $('#tchat').classList.remove('show'); $('#tbChat').classList.remove('on'); }
$('#meInput').addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter'){ const t = e.target.value.trim(); closeMeChat(); if (t) sendChat(t); }
  if (e.key === 'Escape') closeMeChat();
});
function sendBarChat(){ const i = $('#tInput'), t = i.value.trim(); i.value = ''; closeMeChat(); if (t){ chat(noha.el, reply(t), 4000); deliver('chat message', t); } }
$('#tInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendBarChat();
  if (e.key === 'Escape') closeMeChat();
});
$('#tSend').onclick = sendBarChat;
$('#tClose').onclick = closeMeChat;
// overlays and focused inputs must never scroll the canvas sideways (into empty space)
canvas.addEventListener('scroll', () => { if (canvas.scrollLeft) canvas.scrollLeft = 0; if (!L.scroll && canvas.scrollTop) canvas.scrollTop = 0; });

/* ---------------- pointer ---------------- */
let dragging = null, tap = null;   // tap: a touch press on a card that may become a tap (touch never drags)
// pointer position inside the canvas content (accounts for scrolling in the phone layout)
const local = e => { const r = canvas.getBoundingClientRect(); return { x:e.clientX - r.left + canvas.scrollLeft, y:e.clientY - r.top + canvas.scrollTop }; };
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse'){
    const p = local(e);
    me.x = p.x; me.y = p.y; me.el.hidden = false; canvas.classList.add('mouse');
    me.el.style.transform = `translate(${me.x}px,${me.y}px)`;
  }
  if (dragging){
    const d = dragging, dx = (e.clientX - d.sx) / S.s, dy = (e.clientY - d.sy) / S.s;
    if (!d.moved && Math.hypot(dx * S.s, dy * S.s) > 5){ d.moved = true; d.o.el.classList.add('grab'); }
    if (d.moved){   // anywhere in the visible canvas, keeping a corner of the card on screen
      const a = s2w(0, canvas.scrollTop), b = s2w(canvas.clientWidth, canvas.scrollTop + canvas.clientHeight);
      d.o.x = Math.max(a.x - d.o.el.offsetWidth + 80, Math.min(b.x - 80, d.ox + dx));
      d.o.y = Math.max(a.y - 20, Math.min(b.y - 60, d.oy + dy)); d.o.r = 0; pos(d.o);
    }
  }
});
canvas.addEventListener('pointerleave', () => { if (chatOpen) return; me.el.hidden = true; me.x = -99; });   // keep an open chat bubble in view
canvas.addEventListener('pointerdown', e => {
  if (e.target.closest('a, button, input, .composer, .pin')) return;
  // preventDefault keeps the press from moving focus (e.g. onto a card) away from the new comment box
  if (mode === 'comment'){ e.preventDefault(); const p = local(e), w = s2w(p.x, p.y); openComposer(w.x, w.y); return; }
  closeComposer();
  const el = e.target.closest('.obj');
  if (!el || !introDone) return;
  const o = [...cards, exp, about, contact, sticky].find(x => x.el === el);
  if (!o) return;
  // touch: nothing moves, so a swipe always scrolls the page; a quick tap on a card opens it (see pointerup)
  if (e.pointerType !== 'mouse'){ tap = { o, sx:e.clientX, sy:e.clientY, t:performance.now() }; return; }
  // a mouse press would also start a text selection that grows across the page while dragging
  if (e.pointerType === 'mouse'){ e.preventDefault(); window.getSelection()?.removeAllRanges(); }
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  o.el.style.zIndex = ++zTop;
  dragging = { o, sx:e.clientX, sy:e.clientY, ox:o.x, oy:o.y, moved:false };
});
const DROP_LINES = ['ooh, nice spot for it 👌','bold move, I like it 😄','hmm, maybe that is the better layout 🤔','the grid police are watching 👀','you have a designer’s eye ✨'];
let dropN = 0, dropT;
// a world point pulled inside the part of the canvas that's on screen (phones scroll, so most of the page is out of view)
function inView(x, y){
  const a = s2w(0, canvas.scrollTop), b = s2w(canvas.clientWidth, canvas.scrollTop + canvas.clientHeight), m = 24 / S.s;
  return { x:Math.max(a.x + m, Math.min(b.x - m * 2, x)), y:Math.max(a.y + m * 2, Math.min(b.y - m * 5, y)) };
}
function reactToDrop(o){
  clearTimeout(dropT);
  const id = run;
  dropT = setTimeout(async () => {
    const p = inView(o.x + o.el.offsetWidth - 40, o.y + 30);
    try { await moveNoha(p.x, p.y, 600, () => id === run); } catch { return; }
    chat(noha.el, DROP_LINES[dropN++ % DROP_LINES.length], 3400);
  }, 250);
}
function endDrag(){
  if (!dragging) return;
  const d = dragging; dragging = null; d.o.el.classList.remove('grab');
  if (!d.moved){ const i = cards.indexOf(d.o); if (i > -1) openCase(i); }
  else { reactToDrop(d.o); showTidy(true); }
}
/* ---------------- tidy up: everything back to its place ---------------- */
const tidyBtn = $('#tidyBtn');
function showTidy(on){ tidyBtn.classList.toggle('show', on); tidyBtn.setAttribute('aria-hidden', String(!on)); tidyBtn.tabIndex = on ? 0 : -1; }
function tidyUp(){
  showTidy(false); clearTimeout(dropT); window.track('canvas_tidied');
  const moves = [
    ...cards.map((c, i) => [c, L.slots[i][0], L.slots[i][1], 0]),
    ...[[exp, L.exp], [about, L.about], [contact, L.contact]].map(([o, r]) => [o, r[0], r[1], 0]),
    ...(stickyGone ? [] : [[sticky, L.sticky[0], L.sticky[1], L.sticky[4]]])
  ].map(([o, x, y, r]) => ({ o, x0:o.x, y0:o.y, r0:o.r || 0, x, y, r }));
  const t0 = performance.now(), dur = reduced ? 1 : 650;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = ease(k);
    moves.forEach(m => { m.o.x = m.x0 + (m.x - m.x0) * e; m.o.y = m.y0 + (m.y - m.y0) * e; m.o.r = m.r0 + (m.r - m.r0) * e; pos(m.o); });
    if (k < 1) return requestAnimationFrame(step);
    placeSticky(false);
    const id = run;
    const p = inView(L.W * 0.56, L.scroll ? s2w(0, canvas.scrollTop + canvas.clientHeight * 0.35).y : L.H * 0.3);
    moveNoha(p.x, p.y, 600, () => id === run).then(() => chat(noha.el, 'All tidy again ✨', 2600)).catch(() => {});
  };
  requestAnimationFrame(step);
}
tidyBtn.onclick = tidyUp;
canvas.addEventListener('pointerup', e => {
  if (tap){ const t = tap; tap = null; const i = cards.indexOf(t.o);
    if (i > -1 && Math.hypot(e.clientX - t.sx, e.clientY - t.sy) < 10 && performance.now() - t.t < 600) openCase(i); return; }
  endDrag();
});
// the browser took over the touch (e.g. to scroll): drop the drag without opening a case study
canvas.addEventListener('pointercancel', () => { tap = null; if (dragging){ dragging.o.el.classList.remove('grab'); dragging = null; } });
canvas.addEventListener('dblclick', e => {
  if (e.target.closest('.obj, a, button, input, .pin, .composer')) return;
  const p = local(e);
  ['🎉','✨','👏','💜','🔥'].forEach((em, i) => setTimeout(() => {
    const n = document.createElement('div'); n.className = 'emote'; n.textContent = em;
    n.style.left = (p.x - 15 + (Math.random() - .5) * 60) + 'px'; n.style.top = (p.y - 20) + 'px';
    ov.appendChild(n); setTimeout(() => n.remove(), 1500);
  }, i * 90));
});
world.addEventListener('click', e => {
  const t = e.target.closest('[data-t]'); if (t){ tab = +t.dataset.t; renderAbout(true); $(`#tabs [data-t="${tab}"]`).focus(); return; }
  const cv = e.target.closest('[data-cv]'); if (cv){ e.preventDefault(); chat(noha.el, 'Résumé link coming soon 📄', 2600); }
});

/* copy email (falls back to opening the mail app) */
let copyT;
$('#lnEmail').addEventListener('click', async () => {
  let ok = false;
  try { await navigator.clipboard.writeText(C.email); ok = true; } catch {
    const t = document.createElement('textarea'); t.value = C.email; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); try { ok = document.execCommand('copy'); } catch {} t.remove();
  }
  if (!ok){ location.href = 'mailto:' + C.email; return; }
  $('#lnEmail').classList.add('done'); $('#cp').textContent = 'Copied ✓';
  const b = $('#lnEmail'), id = run;
  moveNoha(contact.x + b.offsetLeft + b.offsetWidth - 60, contact.y + b.offsetTop + b.offsetHeight + 8, 500, () => id === run)
    .then(() => chat(noha.el, 'Copied! Talk soon 📬', 2600)).catch(() => {});
  clearTimeout(copyT); copyT = setTimeout(() => { $('#lnEmail').classList.remove('done'); $('#cp').textContent = 'Copy'; }, 2400);
});

/* ---------------- toolbar + keys ---------------- */
$('#tMove').onclick = () => setMode('move');
$('#tComment').onclick = () => setMode(mode === 'comment' ? 'move' : 'comment');
$('#tbComment').onclick = () => setMode(mode === 'comment' ? 'move' : 'comment');
$('#tChat').onclick = openMeChat;
$('#tbChat').onclick = () => chatOpen ? closeMeChat() : openMeChat();
$('#hireBtn').onclick = () => { if (!introDone) skip(); if (L.scroll) contact.el.scrollIntoView({ behavior:reduced ? 'auto' : 'smooth', block:'center' }); contact.el.animate([{ transform:'scale(1)' }, { transform:'scale(1.04)' }, { transform:'scale(1)' }], { duration:500 }); chat(noha.el, 'Right here 👇 email, LinkedIn or Behance', 3200); moveNoha(contact.x + 40, contact.y + 30, 600, () => true).catch(() => {}); };
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (e.key === 'Escape'){
    if ($('#nda').classList.contains('show')) return closeNda();
    if ($('#list').classList.contains('show')) return $('#list').classList.remove('show');
    closeMeChat(); closeComposer(); setMode('move'); return;
  }
  const k = e.key.toLowerCase();
  if (k === 'c') setMode(mode === 'comment' ? 'move' : 'comment');
  else if (k === 'v') setMode('move');
  else if (e.key === '/'){ e.preventDefault(); openMeChat(); }
  else if (k === 'l') $('#list').classList.add('show');
});

/* ---------------- analytics events ---------------- */
$('#lnCv').addEventListener('click', () => track('cv_downloaded', { from:'home' }));
[['#lnEmail', 'copy_email'], ['#lnLinkedin', 'linkedin'], ['#lnBehance', 'behance'], ['#hireBtn', 'contact_button']]
  .forEach(([sel, via]) => $(sel)?.addEventListener('click', () => track('contact_clicked', { via, from:'home' })));

/* ---------------- case study pages + list ---------------- */
const caseUrl = p => `project.html?p=${encodeURIComponent(p.slug)}`;
function openCase(i){ if (PROJECTS[i].nda) return openNda('canvas'); location.href = caseUrl(PROJECTS[i]); }
// the NDA note
function openNda(from){ $('#list').classList.remove('show'); $('#nda').classList.add('show'); $('#ndaGo').focus({ preventScroll:true }); window.track('nda_note_opened', { from }); }
const closeNda = () => $('#nda').classList.remove('show');
if (C.nda){ $('#ndaTitle').textContent = C.nda.title; $('#ndaText').innerHTML = C.nda.text.map(t => `<p>${esc(t)}</p>`).join(''); }
$('#ndaClose').onclick = closeNda;
// any [data-nda-open] (the Experience tag, the line above the cards) opens the note
document.addEventListener('click', e => { const t = e.target.closest('[data-nda-open]'); if (t) openNda(t.id === 'ndaLine' ? 'line' : 'experience'); });
if (C.nda) $('#ndaLine').innerHTML = `${LOCK_SVG}<span>${esc(C.nda.line)}</span><b>Read more →</b>`;
function showNdaLine(animate){
  if (NDA_AT !== 'line') return;
  const el = $('#ndaLine'); Object.assign(el.style, { left:L.t2[0] + 'px', top:L.top + 'px', maxWidth:(L.stack ? L.cardW : L.cardW * 4 + 66) + 'px' });
  el.classList.remove('hide');
  if (animate && !reduced) el.animate([{ opacity:0, transform:'translateY(6px)' }, { opacity:1, transform:'none' }], { duration:350, easing:'ease-out' });
}
$('#nda').addEventListener('click', e => { if (e.target.id === 'nda') closeNda(); });
$('#ndaGo').onclick = () => { closeNda(); $('#hireBtn').click(); };
$('#ndaWork').onclick = () => { closeNda(); $('#list').classList.add('show'); };
moreLink.onclick = () => { $('#list').classList.add('show'); window.track('all_work_opened', { from:'canvas' }); };
$('#lgrid').innerHTML = ALL_WORK.map(p => {
  const inner = `<div class="sw2" style="background:${p.bg}">${thumb(p)}</div><div class="tx"><b>${esc(p.title)}</b><span>${esc(p.kicker)}</span></div>`;
  return p.nda ? `<button type="button" class="litem" data-nda>${inner}</button>` : `<a class="litem" href="${caseUrl(p)}">${inner}</a>`;
}).join('');
$('#lgrid [data-nda]')?.addEventListener('click', () => openNda('list'));
$('#listBtn').onclick = () => $('#list').classList.add('show');
$('#lClose').onclick = () => $('#list').classList.remove('show');
$('#list').addEventListener('click', e => { if (e.target.id === 'list') $('#list').classList.remove('show'); });

/* ---------------- boot ---------------- */
L = pickLayout(); placeText(); flow(); fit(); resetScene();
new ResizeObserver(() => {
  const nl = pickLayout();
  if (nl !== L){ L = nl; placeText(); flow(); fit(); if (introDone){ finalScene(); } else { intro(); } }
  else fit();
}).observe(canvas);
// the web font changes text heights once it arrives: measure again
document.fonts?.ready.then(() => { flow(); fit(); if (introDone) finalScene(); });
// coming back from a case study (or already watched this visit): go straight to the finished page
let seen = location.hash === '#work';
try { seen = seen || sessionStorage.getItem(SEEN) === '1'; } catch {}
seen ? skip() : intro();
})();
</script>
